  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0e27;
      color: #fff;
      padding: 5px;
      min-height: 100vh;
    }

    .container {
      margin: 0 auto;
    }

    .banner {
      position: relative;
      background-image: url('../mtg/assets/header-banner.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 0 5px;
      text-align: center;
      overflow: hidden;
      margin: -5px -5px 0 -5px;
      width: calc(100% + 10px);
      margin-left: -5px;
      min-height: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.78) 0%, rgba(118, 75, 162, 0.78) 100%);
      z-index: 1;
    }

    .banner-content {
      position: relative;
      z-index: 2;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      margin-bottom: 8px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .subtitle {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 0;
    }

    .score-display {
      display: flex;
      gap: 40px;
      justify-content: center;
      margin-top: 12px;
      font-size: 13px;
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-value {
      font-size: 24px;
      font-weight: 700;
      color: #4a9eff;
    }

    .score-label {
      color: #aaa;
      font-size: 12px;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-section {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-label {
      display: none;
    }

    select {
      padding: 10px 12px;
      background: rgba(74, 158, 255, 0.25);
      border: 1px solid rgba(74, 158, 255, 0.5);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 140px;
    }

    select:hover {
      border-color: #4a9eff;
      background: rgba(74, 158, 255, 0.35);
    }

    select:focus {
      outline: none;
      border-color: #4a9eff;
      box-shadow: 0 0 8px rgba(74, 158, 255, 0.3);
    }

    select option {
      background: #0a0e27;
      color: #fff;
    }

    .quiz-section {
      padding: 30px;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
    }

    .quiz-prompt {
      text-align: center;
      font-size: 16px;
      margin-bottom: 30px;
      color: #ddd;
      max-width: 65ch;
      margin-left: auto;
      margin-right: auto;
    }

    .card-area {
      display: flex;
      gap: 30px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    .card-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      flex: 1 1 45%;
      min-width: 250px;
      max-width: 500px;
    }

    @media (max-width: 1100px) {
      .card-panel {
        flex: 1 1 40%;
      }
    }

    @media (max-width: 900px) {
      .card-panel {
        flex: 1 1 35%;
      }

      .card-image-container {
        height: 350px;
      }

      .card-area {
        gap: 20px;
      }
    }

    @media (max-width: 700px) {
      .quiz-section {
        padding: 0;
        margin-bottom: 20px;
      }

      .card-panel {
        flex: 1 1 100%;
        min-width: auto;
      }

      .card-image-container {
        height: 300px;
      }

      .card-area {
        gap: 0;
        margin-bottom: 20px;
      }
    }

    @media (max-width: 500px) {
      .card-image-container {
        height: 250px;
      }
    }

    .card-image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 400px;
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .card-image-container:hover:not(.disabled) {
      background: rgba(0, 0, 0, 0.5);
      border-color: rgba(74, 158, 255, 0.5);
      transform: scale(1.02);
    }

    .card-image-container.disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    .card-image {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .gih-percentage {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #4a9eff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 56px;
      font-weight: 700;
      display: none;
      border: 2px solid #4a9eff;
      width: 90%;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .gih-value {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .gih-percentage.show {
      display: flex;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .card-image-container.winner {
      border-color: rgba(76, 175, 80, 0.8);
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
    }

    .card-image-container.loser {
      opacity: 0.6;
    }

    .card-loading {
      color: #666;
      font-size: 14px;
    }

    .card-error {
      color: #ff6b6b;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }

    .card-oracle-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.3);
      overflow: auto;
    }

    .card-fallback-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 100%;
      text-align: left;
      font-family: Georgia, serif;
    }

    .card-fallback-name {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .card-fallback-mana {
      color: #bbb;
      font-size: 12px;
      font-weight: 600;
    }

    .card-fallback-type {
      color: #999;
      font-size: 12px;
      font-style: italic;
      line-height: 1.3;
    }

    .card-fallback-pt {
      color: #999;
      font-size: 14px;
      font-weight: 700;
      text-align: right;
      padding-right: 4px;
    }

    .card-fallback-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 4px 0;
    }

    .card-fallback-text {
      color: #ccc;
      font-size: 12px;
      line-height: 1.5;
      font-family: Courier New, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card-name {
      font-size: 16px;
      font-weight: 700;
      color: #4a9eff;
      text-align: center;
      text-decoration: none;
      transition: color 0.2s;
    }

    .card-name:hover {
      color: #6badff;
      text-decoration: underline;
    }


    .result-panel {
      background: rgba(74, 158, 255, 0.1);
      border: 2px solid rgba(74, 158, 255, 0.3);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
      animation: slideDown 0.3s ease-out;
      order: -1;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-correct {
      background: rgba(76, 175, 80, 0.15);
      border-color: rgba(76, 175, 80, 0.5);
    }

    .result-incorrect {
      background: rgba(255, 107, 107, 0.15);
      border-color: rgba(255, 107, 107, 0.5);
    }

    .result-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }

    .result-correct .result-title {
      color: #4caf50;
      animation: pulse 1.5s ease-in-out;
    }

    .result-incorrect .result-title {
      color: #ff6b6b;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    .result-content {
      font-size: 15px;
      color: #ddd;
      display: grid;
      gap: 12px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .result-card-name {
      font-weight: 600;
      flex: 1;
    }

    .result-value {
      font-size: 18px;
      font-weight: 700;
      color: #4a9eff;
      margin-left: 16px;
    }

    .next-button {
      padding: 12px 24px;
      background: rgba(74, 158, 255, 0.2);
      border: 2px solid rgba(74, 158, 255, 0.4);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .next-button:hover {
      background: rgba(74, 158, 255, 0.3);
      border-color: #4a9eff;
      transform: translateY(-2px);
    }

    .result-info .result-title {
      color: #4a9eff;
      font-size: 22px;
    }

    .result-info-text {
      text-align: center;
      color: #ddd;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .result-info-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .error-message {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff9999;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .info-text {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 20px;
    }

    .metadata-section {
      text-align: center;
      margin-bottom: 16px;
      font-size: 11px;
      color: #aaa;
    }

    .metadata-section a {
      color: #4a9eff;
      text-decoration: none;
      transition: color 0.2s;
    }

    .metadata-section a:hover {
      color: #7b68ee;
      text-decoration: underline;
    }

    .metadata-line {
      margin: 2px 0;
    }

    .beta-badge {
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(255, 68, 68, 0.4);
      z-index: 1000;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 2px solid #ff6666;
    }

    .beta-badge.local {
      top: 70px;
    }

    @media (max-width: 768px) {
      .beta-badge {
        top: 10px;
        right: 10px;
        padding: 8px 14px;
        font-size: 12px;
      }

      .beta-badge.local {
        top: 55px;
      }

      h1 {
        font-size: 24px;
      }
    }

    /* History section styles */
    .history-section {
      margin-top: 40px;
      padding: 30px;
      background: rgba(74, 158, 255, 0.05);
      border: 1px solid rgba(74, 158, 255, 0.2);
      border-radius: 12px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .history-title {
      font-size: 24px;
      font-weight: 700;
      color: #4a9eff;
    }

    .history-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-button {
      padding: 12px 20px;
      min-height: 44px;
      min-width: 44px;
      background: rgba(74, 158, 255, 0.2);
      border: 2px solid rgba(74, 158, 255, 0.4);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-button:hover {
      background: rgba(74, 158, 255, 0.3);
      border-color: #4a9eff;
      transform: translateY(-2px);
    }

    .action-button.danger {
      background: rgba(255, 107, 107, 0.2);
      border-color: rgba(255, 107, 107, 0.4);
    }

    .action-button.danger:hover {
      background: rgba(255, 107, 107, 0.3);
      border-color: #ff6b6b;
    }

    .history-table-container {
      overflow-x: auto;
      margin-top: 20px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .history-table th {
      background: rgba(74, 158, 255, 0.15);
      padding: 10px 8px;
      text-align: left;
      color: #4a9eff;
      font-weight: 600;
      border-bottom: 2px solid rgba(74, 158, 255, 0.3);
      white-space: nowrap;
    }

    .history-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(74, 158, 255, 0.1);
      color: #ddd;
      white-space: nowrap;
    }

    .history-table tr:hover {
      background: rgba(74, 158, 255, 0.05);
    }

    .history-result-icon {
      font-size: 18px;
      font-weight: 700;
    }

    .history-result-correct {
      color: #4caf50;
    }

    .history-result-incorrect {
      color: #ff6b6b;
    }

    .history-result-partial {
      color: #ffc107;
    }

    .history-card-name {
      color: #4a9eff;
      text-decoration: none;
      transition: color 0.2s;
    }

    .history-card-name:hover {
      color: #6badff;
      text-decoration: underline;
    }

    .history-empty {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 14px;
    }

    .history-window-pills {
      margin-bottom: 12px;
    }

    .history-table tr.history-divider:hover {
      background: none;
    }

    .history-divider td {
      padding: 0 !important;
      border: none !important;
    }

    .history-divider span {
      display: block;
      border-top: 1px solid rgba(74, 158, 255, 0.6);
      padding: 1px 8px 2px;
      color: #6f9fd8;
      font-size: 10px;
      letter-spacing: 0.3px;
      text-align: left;
    }

    .history-show-more {
      display: block;
      margin: 12px auto 0;
      padding: 8px 18px;
      background: rgba(74, 158, 255, 0.12);
      border: 1px solid rgba(74, 158, 255, 0.35);
      border-radius: 6px;
      color: #bbb;
      font-size: 13px;
      cursor: pointer;
    }

    .history-show-more:hover {
      border-color: #4a9eff;
      color: #fff;
    }

    .insights-panel {
      margin-bottom: 24px;
      padding: 20px;
      background: rgba(74, 158, 255, 0.06);
      border: 1px solid rgba(74, 158, 255, 0.25);
      border-radius: 10px;
    }

    .insights-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .insights-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .insights-pill {
      padding: 6px 14px;
      background: rgba(74, 158, 255, 0.12);
      border: 1px solid rgba(74, 158, 255, 0.35);
      border-radius: 999px;
      color: #bbb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .insights-pill:hover {
      border-color: #4a9eff;
      color: #fff;
    }

    .insights-pill.active {
      background: rgba(74, 158, 255, 0.35);
      border-color: #4a9eff;
      color: #fff;
    }

    .insights-set-select {
      padding: 6px 10px;
      background: #0a0e27;
      border: 1px solid rgba(74, 158, 255, 0.4);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }

    .insights-caption {
      width: 100%;
      color: #777;
      font-size: 12px;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    .insights-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(74, 158, 255, 0.15);
    }

    .insights-section-title {
      font-size: 16px;
      font-weight: 700;
      color: #4a9eff;
      margin-bottom: 8px;
    }

    .insights-headline {
      color: #ddd;
      font-size: 14px;

    }

      background: rgba(74, 158, 255, 0.1);

      color: #ffc107;
