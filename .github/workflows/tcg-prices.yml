# This file is synced to the Pages repo as .github/workflows/tcg-prices.yml by
# scripts/sync-to-github-pages.ps1. Edit it here, never in the mirror.
# Publishes the deckbuilder's data to the orphan `price-data` branch (single
# force-pushed commit, no main-history growth), fetched by the page via
# jsDelivr.  Two cadences, because they change at very different rates:
#   * tcg-prices.json  (TCGcsv Mid)        -> rebuilt EVERY day
#   * cards-index.json (Scryfall name->id, -> rebuilt MONTHLY (1st) or on
#       legalities, image)                    demand; carried forward daily
# Brand-new cards not yet in the index fall back to live Scryfall on the
# page, so a stale index is safe between rebuilds.  After a B&R announcement
# or a big set release, trigger a manual run with rebuild_index = true.
# Source of truth: ClaudeProjects mtg/budget-modern-deckbuilder/deploy/.

name: Refresh price-data

on:
  schedule:
    - cron: "30 20 * * *"      # 20:30 UTC daily (after TCGcsv ~20:00)
  workflow_dispatch:
    inputs:
      rebuild_index:
        description: "Also rebuild the Scryfall card index (do this after a B&R or new set)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous data from price-data branch
        run: |
          set -e
          D=mtg/budget-modern-deckbuilder/data
          mkdir -p "$D"
          if git fetch --depth 1 origin price-data 2>/dev/null; then
            for f in cards-index.json tcg-prices.json data-meta.json; do
              git show "FETCH_HEAD:$f" > "$D/$f" 2>/dev/null || true
            done
            [ -s "$D/cards-index.json" ] && echo "HAVE_INDEX=1" >> "$GITHUB_ENV" || true
          fi

          # How old is the index we just carried forward?
          #
          # Added 2026-08-07. The monthly rebuild is scheduled on day 01, but a
          # scheduled GitHub Actions run can be delayed or dropped, and nothing
          # noticed when that happened: on 2026-08-07 the live index was still
          # the one built on 2026-07-01, five weeks stale. The only symptom was
          # cards printed since then quietly falling back to live Scryfall
          # lookups on the page - slower, and this project has a history of
          # being rate-limited (429) by exactly that.
          #
          # A missed run should heal itself rather than wait for a human to
          # notice, so age is checked here and used as a second rebuild trigger
          # below. Failing loudly would be the lesser fix: it would still leave
          # the index stale until someone acted.
          AGE=""
          if [ -s "$D/cards-index.json" ]; then
            IDX_AT=$(jq -r '.generatedAt // empty' "$D/cards-index.json" 2>/dev/null || true)
            if [ -n "$IDX_AT" ]; then
              IDX_S=$(date -u -d "$IDX_AT" +%s 2>/dev/null || true)
              if [ -n "$IDX_S" ]; then
                AGE=$(( ( $(date -u +%s) - IDX_S ) / 86400 ))
                echo "INDEX_AGE_DAYS=$AGE" >> "$GITHUB_ENV"
              fi
            fi
          fi
          echo "Carried index built: ${IDX_AT:-unknown} (age: ${AGE:-unknown} days)"

      - name: Decide whether to rebuild the index
        run: |
          DOM=$(date -u +%d)
          STALE_AFTER_DAYS=35          # a month plus slack, so day-01 normally wins
          AGE="${INDEX_AGE_DAYS:-}"

          STALE=""
          if [ -n "$AGE" ] && [ "$AGE" -ge "$STALE_AFTER_DAYS" ]; then STALE=1; fi

          if [ "${{ github.event.inputs.rebuild_index }}" = "true" ] \
             || [ "$DOM" = "01" ] || [ -z "${HAVE_INDEX:-}" ] || [ -n "$STALE" ]; then
            echo "REBUILD_INDEX=1" >> "$GITHUB_ENV"
            echo "Index WILL be rebuilt (dispatch=$([ "${{ github.event.inputs.rebuild_index }}" = "true" ] && echo y || echo n), day=$DOM, have=${HAVE_INDEX:-none}, age=${AGE:-unknown}d)"
            if [ -n "$STALE" ]; then
              # Surfaced as a run annotation, not just a log line: reaching this
              # branch means the day-01 rebuild did not happen, and that is worth
              # seeing in the Actions list rather than only inside the log.
              echo "::warning::Card index was ${AGE} days old (limit ${STALE_AFTER_DAYS}) - the scheduled day-01 rebuild appears to have been missed. Rebuilding now."
            fi
          else
            echo "Index carried forward (prices-only run, age ${AGE:-unknown}d)"
          fi

      - name: Build (prices always; index monthly / on demand)
        run: |
          if [ -n "${REBUILD_INDEX:-}" ]; then
            node mtg/budget-modern-deckbuilder/scripts/build-data.mjs
          else
            node mtg/budget-modern-deckbuilder/scripts/build-data.mjs --no-index
          fi

      - name: Publish to orphan price-data branch (single force-pushed commit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          SRC="$PWD/mtg/budget-modern-deckbuilder/data"
          WORK="$(mktemp -d)"
          cp "$SRC/tcg-prices.json" "$SRC/cards-index.json" "$SRC/data-meta.json" "$WORK/"
          cd "$WORK"
          git init -q
          git checkout -q -b price-data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          MSG="price-data $(date -u +%Y-%m-%dT%H:%MZ)"
          [ -n "${REBUILD_INDEX:-}" ] && MSG="$MSG (index rebuilt)" || MSG="$MSG (prices only)"
          git commit -q -m "$MSG"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" price-data

      - name: Purge jsDelivr edge cache
        env:
          REPO: ${{ github.repository }}
        run: |
          for f in tcg-prices.json cards-index.json data-meta.json; do
            curl -sS "https://purge.jsdelivr.net/gh/${REPO}@price-data/${f}" >/dev/null || true
          done
          echo "purge requested"
