# This file is synced to the Pages repo as .github/workflows/tcg-prices.yml by
# scripts/sync-to-github-pages.ps1. Edit it here, never in the mirror.
#
# PRICES ONLY. The Scryfall card index is refreshed by its sibling workflow,
# cards-index.yml (source: deploy/cards-index.github-workflow.yml).
#
# Why they are separate (split 2026-08-16): they used to be one job, one script
# call. On 2026-08-14 Scryfall changed its /bulk-data response shape, the index
# build threw, and the job died BEFORE publishing - so an index-only bug also
# froze the daily price snapshot for three days. Prices are the thing users
# actually read off the page every day; nothing about a card index should be
# able to stop them refreshing.
#
# Both workflows publish the same three files to the orphan `price-data` branch
# (single force-pushed commit, no main-history growth), fetched by the page via
# jsDelivr. Each restores all three from the branch, rebuilds only its own, and
# pushes all three back - so they must never run at once. They share the
# `price-data` concurrency group, and their schedules are ~17 h apart anyway.
#
#   * tcg-prices.json  (TCGcsv Mid)   <- THIS workflow, daily
#   * cards-index.json (Scryfall)     <- cards-index.yml, monthly / on staleness
#   * data-meta.json   (both)         <- merged, never rewritten wholesale
#
# Failure policy: the 20:30 run is the primary. If it fails or never fires, the
# 21:30 slot retries. Only a failing RETRY raises an alert issue, so a one-off
# blip stays quiet. Turn off GitHub's own Actions email notifications, or you
# will still be mailed about the primary failure this is designed to absorb.

name: Refresh price-data

on:
  schedule:
    - cron: "30 20 * * *"      # primary: 20:30 UTC daily (after TCGcsv ~20:00)
    - cron: "30 21 * * *"      # retry:   only acts if the 20:30 slot did not succeed
  workflow_dispatch:

permissions:
  contents: write              # force-push the price-data branch
  actions: read                # the retry gate reads this workflow's own run history
  issues: write                # open/close the alert issue

concurrency:
  group: price-data            # SHARED with cards-index.yml - both write the branch
  cancel-in-progress: false

env:
  RETRY_CRON: "30 21 * * *"
  ALERT_TITLE: "[price-data] daily TCG Mid price refresh is failing"

jobs:
  # Cheap gate so the retry slot is a ~10 s no-op on the ~364 days a year the
  # primary worked. Gating on "did a run SUCCEED today" rather than "did the
  # last run fail" also covers the case where GitHub silently drops a scheduled
  # run entirely (it dropped 2026-08-06), which a last-run check would miss.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$SCHEDULE" != "$RETRY_CRON" ]; then
            echo "Primary slot (or manual dispatch) - running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          OK=$(gh api "repos/$REPO/actions/workflows/tcg-prices.yml/runs?per_page=30" \
                 --jq "[.workflow_runs[]
                        | select(.id != $RUN_ID)
                        | select(.created_at | startswith(\"$TODAY\"))
                        | select(.conclusion == \"success\")] | length")
          if [ "$OK" -gt 0 ]; then
            echo "A run already succeeded today ($OK) - retry not needed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No successful price refresh yet today - retrying the 20:30 slot."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore current data from price-data branch
        run: |
          set -e
          D=mtg/budget-modern-deckbuilder/data
          mkdir -p "$D"
          if git fetch --depth 1 origin price-data 2>/dev/null; then
            for f in cards-index.json tcg-prices.json data-meta.json; do
              git show "FETCH_HEAD:$f" > "$D/$f" 2>/dev/null || true
            done
          fi
          # --no-index below carries this index forward untouched. If it is
          # absent (first ever run) build-data.mjs builds one rather than
          # publishing a branch with a missing file.
          [ -s "$D/cards-index.json" ] && echo "Carried index forward." || echo "No index present - it will be built."

      - name: Build prices (index carried forward)
        run: node mtg/budget-modern-deckbuilder/scripts/build-data.mjs --no-index

      - name: Publish to orphan price-data branch (single force-pushed commit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          SRC="$PWD/mtg/budget-modern-deckbuilder/data"
          WORK="$(mktemp -d)"
          cp "$SRC/tcg-prices.json" "$SRC/cards-index.json" "$SRC/data-meta.json" "$WORK/"
          cd "$WORK"
          git init -q
          git checkout -q -b price-data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "price-data $(date -u +%Y-%m-%dT%H:%MZ) (prices)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" price-data

      - name: Purge jsDelivr edge cache
        env:
          REPO: ${{ github.repository }}
        run: |
          for f in tcg-prices.json cards-index.json data-meta.json; do
            curl -sS "https://purge.jsdelivr.net/gh/${REPO}@price-data/${f}" >/dev/null || true
          done
          echo "purge requested"

      # --- alerting ----------------------------------------------------
      # Only the retry raises the alarm: the primary failing is what the retry
      # is for. GitHub emails you about issues in your own repo, so an issue is
      # the email - no SMTP secrets to hold.
      - name: Alert - refresh failed twice
        if: failure() && github.event.schedule == '30 21 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          URL="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
          # Exact title match rather than `--search`: the title contains
          # characters GitHub's search syntax reads as operators.
          NUM=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                  --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" | head -n1)
          BODY=$(cat <<EOF
          The daily TCG Mid price refresh failed at **both** the 20:30 and 21:30 UTC slots on $(date -u +%Y-%m-%d).

          Failed retry run: $URL

          The page keeps serving the last good snapshot from the \`price-data\` branch and shows its age in the banner, so the only symptom on the site is stale prices.

          This issue closes itself on the next successful run.
          EOF
          )
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
            echo "Commented on existing alert issue #$NUM"
          else
            gh issue create --repo "$REPO" --title "$ALERT_TITLE" --body "$BODY"
          fi

      - name: Close the alert issue after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          NUM=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                  --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" | head -n1)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$REPO" \
              --comment "Recovered: prices refreshed successfully in ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}."
            echo "Closed alert issue #$NUM"
          fi
