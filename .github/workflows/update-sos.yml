name: Daily 17Lands Data Refresh

# Runs every day at 06:00 UTC. 17Lands' nightly stats job starts at 00:00 UTC
# and "takes a few hours" per their FAQ (https://www.17lands.com/faq), so 6:00
# UTC gives them a 6-hour buffer. In practice GitHub delays scheduled actions
# under load, so runs often land between 08:00-11:00 UTC — still well after
# 17Lands has finished its nightly update.
#
# Source of truth: ClaudeProjects\mtg\scripts\deploy\update-sos.github-workflow.yml,
# copied here by sync-to-github-pages.ps1 (since 2026-10-10; before that this file
# existed only in the Pages repo). Edit the source, not this copy.
#
# Refreshes SOS (under/over-rated + archetypes + quiz), MSH, HOB and FRA (quiz
# only) in a single job so they all land in ONE commit. They share the quiz
# file (QUIZ_VERSION + changelog), so running them sequentially here avoids the
# merge/push races separate workflows would hit. Each refresh is continue-on-error
# so a transient failure in one set never blocks the others or the commit.
#
# DATA-ONLY: the refresh scripts update the beta AND index (production) files
# INDEPENDENTLY. Do NOT add --promote here — that copies quiz-beta.html over
# index.html (and sos-beta over sos-index), silently shipping untested beta CODE
# to production. Promotion is a manual, human decision:
#   python mtg/scripts/refresh_msh_quiz.py --promote        (quiz)
#   python mtg/scripts/refresh_hob_quiz.py --promote        (quiz)
#   python mtg/scripts/refresh_fra_quiz.py --promote        (quiz)
#   python mtg/scripts/refresh_sos_17lands.py --promote     (quiz + SOS pages)
# FRA is beta-only until promoted: refresh_fra_quiz.py refreshes only the quiz
# files that already carry a FRA_CARDS array and skips the rest.
# (--promote was removed from this workflow on 2026-07-02 after beta code
# auto-shipped to production overnight.)
#
# To pause: disable from the Actions tab.
# To stop completely: delete this file.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:    # also runnable manually from the Actions tab

permissions:
  contents: write       # needed to commit and push back

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # checkout/setup-python v7 = Node 24 (v4/v5 ran on the deprecated Node 20).
      # The write token stays out of .git/config while the refresh scripts fetch
      # third-party data; only the commit step gets it (same as manifold-bot.yml).
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run SOS refresh (fetch + apply to beta AND index, no promote)
        continue-on-error: true
        run: |
          python mtg/scripts/refresh_sos_17lands.py --fetch --apply --force

      - name: Run MSH quiz refresh (fetch + apply to beta AND index, no promote)
        continue-on-error: true
        run: |
          python mtg/scripts/refresh_msh_quiz.py --fetch --apply --force

      - name: Run HOB quiz refresh (fetch + apply to beta AND index, no promote)
        continue-on-error: true
        run: |
          python mtg/scripts/refresh_hob_quiz.py --fetch --apply --force

      - name: Run FRA quiz refresh (fetch + apply to quiz files that carry FRA, no promote)
        continue-on-error: true
        run: |
          python mtg/scripts/refresh_fra_quiz.py --fetch --apply --force

      - name: Commit and push if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --staged --quiet; then
            echo "No changes - skipping commit."
            exit 0
          fi

          git commit -m "Auto-refresh 17Lands data (SOS + MSH + HOB + FRA)

          Generated by .github/workflows/update-sos.yml at $(date -u +%Y-%m-%dT%H:%MZ)."

          git push
