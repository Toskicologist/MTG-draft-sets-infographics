name: Daily 17Lands Data Refresh

# Runs every day at 06:00 UTC. 17Lands' nightly stats job starts at 00:00 UTC
# and "takes a few hours" per their FAQ (https://www.17lands.com/faq), so 6:00
# UTC gives them a 6-hour buffer. In practice GitHub delays scheduled actions
# under load, so runs often land between 08:00-11:00 UTC — still well after
# 17Lands has finished its nightly update.
#
# Source of truth: ClaudeProjects\mtg\scripts\deploy\update-sos.github-workflow.yml,
# copied here by sync-to-github-pages.ps1 (since 2026-10-10; before that this file
# existed only in the Pages repo). Edit the source, not this copy.
#
# Refreshes SOS (under/over-rated + archetypes + quiz), MSH and HOB (production
# quiz page), then the quiz data file, in a single job so they all land in ONE
# commit. Each refresh is continue-on-error so a transient failure in one set
# never blocks the others or the commit. That also made every run green even
# when every fetch failed, so since 2026-10-31 the LAST step fails the run if
# any refresh failed - after the commit has landed - and GitHub's failure email
# says so. The push rebases and retries, like manifold-bot.yml.
#
# Since 2026-10-24 the beta quiz pages (quiz-beta.html, pack-beta.html) embed no
# cards: they read 17lands-quiz/data/quiz-data.js, which only the last refresh
# step writes. That step refreshes the newest sets (reusing the CSVs the steps
# before it fetched) and adds new 17Lands sets by itself (refresh_quiz_data.py).
# The per-set steps now touch only production index.html, which still embeds
# its data until the beta is promoted (FRA is not on it, so FRA has no step).
#
# DATA-ONLY: the refresh scripts update beta data and index (production)
# INDEPENDENTLY. Do NOT add --promote here — that copies quiz-beta.html over
# index.html (and sos-beta over sos-index), silently shipping untested beta CODE
# to production. Promotion is a manual, human decision. For the quiz, do it in
# ClaudeProjects (mtg/quiz-project/17lands-quiz/: make index.html from
# quiz-beta.html, give it a line in scripts/pages-allowlist.txt and delete that
# file's "hold 17lands-quiz/index.html" line);
# for the SOS pages, copy sos-beta.html over sos-index.html in
# mtg/ratings-project/underover-rated/sos/ (sos-index.html is Action-owned and
# held by the sync; see "Action-owned files" in docs/PUBLISHING.md).
# The refresh scripts' --apply and --promote refuse to run on a PC since
# 2026-11-01 (config.refuse_local_writes): on a PC they write into the mirror,
# and --promote also copied quiz-beta.html, which holds no card data since
# 10-24, over the production quiz.
# (--promote was removed from this workflow on 2026-07-02 after beta code
# auto-shipped to production overnight.)
#
# To pause: disable from the Actions tab.
# To stop completely: remove this file's line from scripts/pages-allowlist.txt,
# add "retire .github/workflows/update-sos.yml", sync; the user pushes.
# (Deleting only this source file leaves the published copy running.)
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:    # also runnable manually from the Actions tab

permissions:
  contents: write       # needed to commit and push back

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # checkout/setup-python v7 = Node 24 (v4/v5 ran on the deprecated Node 20).
      # The write token stays out of .git/config while the refresh scripts fetch
      # third-party data; only the commit step gets it (same as manifold-bot.yml).
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run SOS refresh (fetch + apply to SOS pages and quiz index, no promote)
        id: sos
        continue-on-error: true
        run: |
          python mtg/scripts/refresh_sos_17lands.py --fetch --apply --force

      - name: Run MSH quiz refresh (fetch + apply to quiz index, no promote)
        id: msh
        continue-on-error: true
        run: |
          python mtg/scripts/refresh_msh_quiz.py --fetch --apply --force

      - name: Run HOB quiz refresh (fetch + apply to quiz index, no promote)
        id: hob
        continue-on-error: true
        run: |
          python mtg/scripts/refresh_hob_quiz.py --fetch --apply --force

      # Last, so it reuses the CSVs fetched above. No --force: it refuses a set
      # whose rated-card count drops by more than 10% (a bad export) and keeps
      # that set's previous data.
      - name: Refresh the quiz data file (newest sets + any new 17Lands set)
        id: quizdata
        continue-on-error: true
        run: |
          python mtg/scripts/refresh_quiz_data.py --discover --fetch --apply

      - name: Commit and push if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --staged --quiet; then
            echo "No changes - skipping commit."
            exit 0
          fi

          # Name the sets whose 17Lands exports this run added, e.g. "FRA, HOB, MSH, SOS".
          SETS=$(git diff --staged --name-only --diff-filter=A \
                   | sed -n 's|^mtg/shared-data/17lands exports/\([A-Z0-9]*\) card-ratings-.*|\1|p' \
                   | sort -u | paste -sd, - | sed 's/,/, /g')

          git commit -m "Auto-refresh 17Lands data (${SETS:-no new exports})

          Generated by .github/workflows/update-sos.yml at $(date -u +%Y-%m-%dT%H:%MZ)."

          # The Manifold bot and the user's pushes write to the same branch. Rebase
          # and retry instead of losing the day's refresh to a race.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true   # a conflicted rebase would fail every retry
            sleep $((i * 10))
          done
          echo "::error::Could not push the refresh commit after 3 tries."
          exit 1

      # Runs after the commit, so good data from the other sets still lands.
      # Turns a refresh failure back into a red run (and GitHub's failure email).
      - name: Fail the run if any refresh step failed
        if: steps.sos.outcome == 'failure' || steps.msh.outcome == 'failure' || steps.hob.outcome == 'failure' || steps.quizdata.outcome == 'failure'
        run: |
          echo "::error::Refresh outcomes - SOS: ${{ steps.sos.outcome }}, MSH: ${{ steps.msh.outcome }}, HOB: ${{ steps.hob.outcome }}, quiz data: ${{ steps.quizdata.outcome }}"
          exit 1
