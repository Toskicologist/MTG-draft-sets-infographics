name: Manifold 17Lands bot

# Opens and resolves Manifold Markets markets on 17Lands data for the newest MTG
# set (mtg/manifold/bot.py). This file is generated from a private working copy
# (mtg/manifold/deploy/manifold-bot.github-workflow.yml) by the sync script -
# edit it there, not here.
#
# The Manifold API key is the MANIFOLD_API_KEY repository secret (Settings >
# Secrets and variables > Actions). It is never in a file: GitHub injects it
# into the bot step only, masks it in logs, and does not pass it to workflows
# run from forks' pull requests. Only GitHub's own actions run in this job, and
# the repository write token is kept out of the bot step (persist-credentials:
# false) and handed only to the commit step.
#
# Checkpoints fall at each set's 17Lands start time (15:00 UTC so far). This
# runs at 15:25 and 21:25 UTC so a delayed or dropped scheduled run is still
# caught the same day; each run is a handful of API calls (well under a
# minute). It is safe to run any number of times: each market has a fixed id,
# and the bot adopts its own market rather than create a second one.
#
# Only mtg/manifold/state/markets.json (and NEEDS_REVIEW.txt) is committed
# back - never state/snapshots (raw 17Lands rows must not be republished) or
# bot.log. A market that needs a human (--fail-on-review) or hit an error makes
# the job fail, and GitHub emails the repo owner.
#
# To pause: disable from the Actions tab. To stop completely: delete this file.
on:
  schedule:
    - cron: '25 15 * * *'
    - cron: '25 21 * * *'
  workflow_dispatch:    # also runnable by hand from the Actions tab

permissions:
  contents: write       # needed to commit markets.json back

concurrency:
  group: manifold-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # no write token in .git/config while the bot runs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the bot
        env:
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
        run: python mtg/manifold/bot.py run --live --fail-on-review

      - name: Commit market state if it changed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add mtg/manifold/state/markets.json
          if [ -f mtg/manifold/state/NEEDS_REVIEW.txt ]; then
            git add mtg/manifold/state/NEEDS_REVIEW.txt
          fi

          if git diff --staged --quiet; then
            echo "No state change - skipping commit."
            exit 0
          fi

          git commit -m "Manifold bot: update market state

          Generated by .github/workflows/manifold-bot.yml at $(date -u +%Y-%m-%dT%H:%MZ)."

          # The daily 17Lands refresh pushes to the same branch, so rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true   # a conflicted rebase would fail every retry
            sleep $((i * 10))
          done
          echo "Could not push the state commit after 3 tries."
          exit 1
