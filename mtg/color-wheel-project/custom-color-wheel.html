    /* ---- shared site header (image + credits, matches other MTG project pages) ----

       location (it lives under mtg/, not the Pages root). See mtg/SHARED_HEADER_FOOTER.md. */
    .site-header { position: relative; border-radius: 12px; overflow: hidden;
      width: 100%; max-width: 900px; margin: 0 0 22px; box-shadow: 0 4px 6px rgba(0,0,0,.18);
      background-image: url('https://toskicologist.github.io/MTG-draft-sets-infographics/mtg/assets/cropped%20ChatGPT%20Image%20Jan%2018,%202026,%2010_33_59%20PM.png');
      background-size: cover; background-position: center; background-repeat: no-repeat; }
    .site-header::before { content: ''; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(135deg, rgba(102,126,234,.78) 0%, rgba(118,75,162,.78) 100%); }
    .site-header .header-content { position: relative; z-index: 2; padding: 26px 28px; color: #fff; }
    .site-header h1 { color: #fff; font-size: 28px; margin: 0 0 6px; text-align: center;
      text-shadow: 1px 1px 3px rgba(0,0,0,.4); font-weight: 700; }
    .site-header h1 span { color: rgba(255,255,255,.78); font-size: 12px; font-weight: 400; text-shadow: none; }
    .site-header .subtitle { text-align: center; color: rgba(255,255,255,.95); font-size: 14px; margin: 0 0 14px; line-height: 1.5; }
    .site-header .data-info { background: rgba(255,255,255,.13); padding: 11px 14px; border-radius: 8px;
      text-align: center; font-size: 12.5px; line-height: 1.7; color: rgba(255,255,255,.95); }
    .site-header .data-info a { color: #fff; text-decoration: underline; }
    .site-header .data-info a:hover { opacity: .85; }
    .site-header .data-info strong { color: #fff; font-weight: 600; }
    .site-header .data-info .sep { opacity: .45; margin: 0 6px; }
    .site-header .data-info .row { margin-top: 7px; }
    @media (max-width: 560px) {
      .site-header .header-content { padding: 20px 16px; }
      .site-header h1 { font-size: 22px; }
    }

    /* ---- label builder table ---- */
    .builder { width: 100%; max-width: 900px; }
    .builder-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .builder-table th { text-align: left; font-size: 12px; text-transform: uppercase;
      letter-spacing: .04em; color: #6B7280; font-weight: 600; padding: 8px 10px;
      border-bottom: 2px solid #E5E7EB; }
    .builder-table td { padding: 7px 10px; border-bottom: 1px solid #F3F4F6; vertical-align: middle; }
    .builder-table tr.is-active td { background: #FFFBEB; }
    .builder-table tr.is-off td { opacity: .55; }
    .builder-table input[type="text"] { width: 100%; padding: 7px 9px; font-size: 14px;
      font-family: inherit; border: 1px solid #D1D5DB; border-radius: 6px; background: #fff; color: #111827; }
    .builder-table input[type="text"]:focus { outline: none; border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
    .builder-table input[type="checkbox"] { width: 17px; height: 17px; cursor: pointer; }
    .pair-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px;
      border-radius: 6px; font-weight: 700; font-size: 13px; white-space: nowrap; }
    .pair-guild { display: block; font-size: 11.5px; color: #9CA3AF; margin-top: 3px; }
    .mlabel { display: none; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
      color: #9CA3AF; font-weight: 600; margin-bottom: 3px; }
    /* Stack each row into a card on narrow screens - a 4-column table does not fit a phone. */
    @media (max-width: 700px) {
      .builder-table thead { display: none; }
      .builder-table, .builder-table tbody, .builder-table tr, .builder-table td { display: block; width: 100%; }
      .builder-table tr { border: 1px solid #E5E7EB; border-radius: 10px; margin-bottom: 10px; padding: 8px 4px; }
      .builder-table td { border-bottom: none; padding: 5px 10px; }
      .mlabel { display: block; }
      .builder-table td.cell-toggle { display: flex; align-items: center; gap: 8px; }
      /* nowrap: in the stacked card this cell is a flex row, so "Show on wheel" would
         otherwise break across three lines next to its checkbox. */
      .builder-table td.cell-toggle .mlabel { margin: 0; white-space: nowrap; }

    .btn { padding: 9px 16px; font-size: 14px; font-weight: 600; font-family: inherit;
      border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all .15s ease; }
    .btn-primary { background: #4F46E5; color: #fff; }
    .btn-primary:hover { background: #4338CA; }
    .btn-secondary { background: #fff; color: #374151; border-color: #D1D5DB; }
    .btn-secondary:hover { background: #F9FAFB; border-color: #9CA3AF; }

                            'background:#fff;border:1px solid #e2e2e2;border-radius:10px;');

        if (missing.length) {

          box.appendChild(el('h1', 'font-size:21px;color:#1a1a1a;margin-bottom:12px;font-weight:600;',

            'The color wheel is drawn in your browser by React, which loads from a CDN along with ' +
            'Babel. Those files could not be fetched, so there is nothing to draw.'));
          box.appendChild(el('p', 'font-size:13px;color:#888;line-height:1.6;margin-top:14px;',

          box.appendChild(el('div', 'font-size:40px;line-height:1;margin-bottom:16px;', '⚠️'));
          box.appendChild(el('h1', 'font-size:21px;color:#1a1a1a;margin-bottom:12px;font-weight:600;',
            'Something went wrong rendering this page'));
          box.appendChild(el('p', 'font-size:15px;color:#555;line-height:1.6;',
            'The libraries loaded, but the page failed to draw. This is a bug, not a connection ' +
            'problem - the browser console has the details.'));

                                    'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;' +
                                    'background:#f7f7f7;border-radius:6px;padding:10px 12px;' +
                                    'word-break:break-word;', firstError));

                                 'background:#4a5568;border:0;border-radius:6px;cursor:pointer;', 'Reload');
        retry.onclick = function () { location.reload(); };
