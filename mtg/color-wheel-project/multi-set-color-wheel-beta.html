  <!-- GoatCounter PATTERN A: count the #hash so each set view (#hob, #msh, …) is its own dashboard path.
       The public count.js snippet is auto-injected at push time, just before the closing head tag; this
       inline config must run first, and does. NOTE: do NOT write the closing-head string literally in this
       comment — the injector inserts before the FIRST such string and would bury count.js inside the comment.
       See mtg/SHARED_HEADER_FOOTER.md "Analytics — GoatCounter". -->
  <script>
    window.goatcounter = {
      path: function () { return location.pathname + location.search + location.hash; }
    };
    addEventListener('hashchange', function () {
      if (window.goatcounter && window.goatcounter.count)
        window.goatcounter.count({ path: location.pathname + location.search + location.hash });
    });

/* LCARS display mode - shared base (mtg/lcars-mode/lcars-mode.css).
 *
 * Unofficial fan styling. Star Trek and LCARS are trademarks of CBS Studios / Paramount;
 * LCARS was designed by Michael Okuda. Palette: the named colors published by TheLCARS.com,
 * "Lower Decks" + "Lower Decks PADD" (the only style since 2026-11-05; the TNG "Classic"

 * Font License 1.1, see Antonio-OFL.txt), loaded from the published antonio-latin.woff2 on this
 * site (the @font-face is added by lcars-inline.js), so it is only fetched when LCARS shows.
 *
 * Everything is scoped under html.lcars, so the standard look is untouched. This file holds
 * only what every page shares: the palette roles, the font, the black page and the toggle
 * button. Each page maps its own layout onto the roles in its own stylesheet.
 *
 * Roles (use these in page rules, never raw hex):
 *   --lc-frame     elbows / main bars        --lc-frame-2, -3   other bar segments
 *   --lc-side-1..4 sidebar blocks            --lc-side-on       the active sidebar block
 *   --lc-fill      sidebar filler            --lc-text          body text on black
 *   --lc-head      headings / emphasis       --lc-link          links
 *   --lc-muted     secondary text            --lc-panel         dark panel / zebra rows
 *   --lc-high / --lc-low / --lc-controv / --lc-agree   top / bottom / disputed / agreed
 *   --lc-band-1..5 a 5-step scale, best (1) to worst (5)
 * Text on any colored block is black (--lc-on).
 */

html.lcars {
    /* Lower Decks + Lower Decks PADD */

    --lc-frame-2: #ffaa44;  /* harvestgold */
    --lc-frame-3: #5588ee;  /* alpha-blue */
    --lc-side-1: #ffcc99;   /* honey */
    --lc-side-2: #ffaa44;   /* harvestgold */

  <script>
/* LCARS display mode - shared switch logic (mtg/lcars-mode/lcars-mode.js).
 *
 * One style only: Lower Decks LCARS (since 2026-11-05; the TNG "Classic" palette was dropped).
 * Inlined into a page's head by lcars-inline.js, BEFORE the body is parsed.
 *
 * "Wanted" = does the visitor want LCARS where a page offers it. Default ON. The choice is
 * remembered per browser (localStorage "mtg-lcars", one setting for the whole site); a link can
 * force it for one visit without saving: ?lcars (on) / ?lcars=off.
 * "Active" = is it showing right now. Pages decide when to apply it:
 *   - <html data-lcars-auto>: a page that is Star Trek throughout (TRK ratings) - applied at
 *     once, and any <button data-lcars-toggle> flips it (text from data-on-text / data-off-text).
 *   - otherwise (the color wheel, only on its TRK tab): the page calls MTGLcars.apply(bool)
 *     itself and MTGLcars.setWanted(bool) from its own button.
 * Never write the literal head-closing tag in this file: it is inlined into the head and the
 * push-time GoatCounter injector inserts before the first such string.
 */
(function () {
    var KEY = 'mtg-lcars';
    var root = document.documentElement;

    function fromQuery() {
        var m = /[?&]lcars(?:=([^&#]*))?/i.exec(window.location.search);
        if (!m) return null;
        var v = (m[1] || 'on').toLowerCase();
        return !(v === 'off' || v === '0' || v === 'false' || v === 'standard' || v === 'no');
    }
    function stored() {
        try { var v = window.localStorage.getItem(KEY); return v === '1' ? true : (v === '0' ? false : null); }
        catch (e) { return null; }
    }
    var forced = fromQuery(), saved = stored();
    var wanted = forced !== null ? forced : (saved !== null ? saved : true);
    var active = false, fontAsked = false;

    function syncButtons() {
        var btns = document.querySelectorAll('[data-lcars-toggle]');
        for (var i = 0; i < btns.length; i++) {
            btns[i].setAttribute('aria-pressed', active ? 'true' : 'false');
            var t = btns[i].getAttribute(active ? 'data-on-text' : 'data-off-text');
            if (t) btns[i].textContent = t;
        }
    }
    function apply(on) {
        active = !!on;
        if (active) root.classList.add('lcars'); else root.classList.remove('lcars');
        // The Antonio font is a separate file, fetched only when LCARS shows: ask for it now
        // rather than when the first LCARS text is laid out, after the page has rendered.
        if (active && !fontAsked && document.fonts && document.fonts.load) {
            fontAsked = true;
            document.fonts.load("400 16px 'Antonio'").catch(function () {});
        }
        syncButtons();
    }

    window.MTGLcars = {
        wanted: function () { return wanted; },
        isActive: function () { return active; },
        apply: apply,
        setWanted: function (on) {
            wanted = !!on;
            try { window.localStorage.setItem(KEY, wanted ? '1' : '0'); } catch (e) { /* private mode: this visit only */ }
            if (window.goatcounter && window.goatcounter.count)
                window.goatcounter.count({ path: 'lcars-' + (wanted ? 'on' : 'off'), title: 'LCARS display ' + (wanted ? 'on' : 'off'), event: true });
        }
    };

    var auto = root.hasAttribute('data-lcars-auto');
    if (auto) apply(wanted);

    document.addEventListener('DOMContentLoaded', function () {
        if (!auto) return;
        syncButtons();
        document.addEventListener('click', function (e) {
            var b = e.target && e.target.closest ? e.target.closest('[data-lcars-toggle]') : null;
            if (!b) return;
            window.MTGLcars.setWanted(!active);
            apply(wanted);
        });
    });
})();

  </script>

  <script>

    // opens on that tab (#trk, or no hash: TRK is the default set while it is last in SET_ORDER) so
    // the page does not flash white; the component's effect keeps it right from then on.
    (function () {
      var h = location.hash.slice(1).toUpperCase();
      if (window.MTGLcars && (h === 'TRK' || h === '')) window.MTGLcars.apply(window.MTGLcars.wanted());
    })();
  </script>

  <!--
    Offline / CDN guard. Everything below is rendered by the type="text/babel" block, which
    needs React, ReactDOM and Babel from unpkg. With no network those never load, Babel never
    compiles the JSX, and #root stays empty - a silent white page. This turns that into a
    readable message. Plain <script> on purpose: it must run when Babel is exactly what failed.
  -->
  <script>
    (function () {
      var firstError = null;
      window.addEventListener('error', function (e) {
        if (!firstError && e && e.message) firstError = e.message;
      }, true);

      function missingLibs() {
        var missing = [];
        if (!window.React) missing.push('React');
        if (!window.ReactDOM) missing.push('ReactDOM');
        // The published copy is precompiled (no Babel tag, no text/babel block), so
        // only count Babel as missing where the page still needs it.
        if (!window.Babel && document.querySelector('script[type="text/babel"]')) missing.push('Babel');
        return missing;
      }

      function el(tag, css, text) {
        var node = document.createElement(tag);
        if (css) node.setAttribute('style', css);
        if (text) node.textContent = text;
        return node;
      }

      function showFailure() {
        var root = document.getElementById('root');
        if (!root || root.childElementCount > 0) return;  // rendered fine, nothing to do

        var missing = missingLibs();
        var box = el('div', 'max-width:620px;margin:80px auto;padding:32px 24px;text-align:center;' +
                            'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
                            'background:#fff;border:1px solid #e2e2e2;border-radius:10px;');

        if (missing.length) {
          box.appendChild(el('div', 'font-size:40px;line-height:1;margin-bottom:16px;', '📡'));
          box.appendChild(el('h1', 'font-size:21px;color:#1a1a1a;margin-bottom:12px;font-weight:600;',
            'This page needs an internet connection'));
          box.appendChild(el('p', 'font-size:15px;color:#555;line-height:1.6;',
            'The color wheel is drawn in your browser by React, which loads from a CDN along with ' +
            'Babel. Those files could not be fetched, so there is nothing to draw.'));
          box.appendChild(el('p', 'font-size:13px;color:#888;line-height:1.6;margin-top:14px;',
            'Did not load: ' + missing.join(', ')));
        } else {
          box.appendChild(el('div', 'font-size:40px;line-height:1;margin-bottom:16px;', '⚠️'));
          box.appendChild(el('h1', 'font-size:21px;color:#1a1a1a;margin-bottom:12px;font-weight:600;',
            'Something went wrong rendering this page'));
          box.appendChild(el('p', 'font-size:15px;color:#555;line-height:1.6;',
            'The libraries loaded, but the page failed to draw. This is a bug, not a connection ' +
            'problem - the browser console has the details.'));
          if (firstError) {
            box.appendChild(el('p', 'font-size:12px;color:#888;margin-top:14px;text-align:left;' +
                                    'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;' +
                                    'background:#f7f7f7;border-radius:6px;padding:10px 12px;' +
                                    'word-break:break-word;', firstError));
          }
        }

        var retry = el('button', 'margin-top:22px;padding:9px 20px;font-size:14px;color:#fff;' +
                                 'background:#4a5568;border:0;border-radius:6px;cursor:pointer;', 'Reload');
        retry.onclick = function () { location.reload(); };
        box.appendChild(retry);

        root.appendChild(box);
      }

      // window.load fires after Babel's DOMContentLoaded transform pass; the timeout leaves
      // room for the first React render before we call it a failure.
      window.addEventListener('load', function () { setTimeout(showFailure, 500); });
    })();
  </script>
