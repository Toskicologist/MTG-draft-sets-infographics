  <!-- GoatCounter PATTERN A: count the #hash so each set view (#hob, #msh, …) is its own dashboard path.
       The public count.js snippet is auto-injected at push time, just before the closing head tag; this
       inline config must run first, and does. NOTE: do NOT write the closing-head string literally in this
       comment — the injector inserts before the FIRST such string and would bury count.js inside the comment.
       See mtg/SHARED_HEADER_FOOTER.md "Analytics — GoatCounter". -->
  <script>
    window.goatcounter = {
      path: function () { return location.pathname + location.search + location.hash; }
    };
    addEventListener('hashchange', function () {
      if (window.goatcounter && window.goatcounter.count)
        window.goatcounter.count({ path: location.pathname + location.search + location.hash });
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    /* Echoverse: the whole page as a photo negative. On the root element the filter does not
       become a containing block, so the fixed hover popup and card previews still position. */
    html { background: #FFFFFF; }
    html.echoverse { filter: invert(1); }
    .echo-btn { padding: 12px 28px; border-radius: 999px; border: 3px solid #111827; background: #111827; color: #FFFFFF;
      font-weight: 800; font-size: 1.15rem; letter-spacing: 0.08em; cursor: pointer; }
    @media (max-width: 480px) { .echo-btn { font-size: 0.95rem; padding: 10px 18px; letter-spacing: 0.05em; } }
    .echo-btn:hover { background: #FFFFFF; color: #111827; }
    @media (max-width: 768px) {
      .color-wheel-svg { max-height: none !important; max-width: 100% !important; width: 100% !important; }
      .main-container { padding: 4px !important; }
      .archetype-grid { grid-template-columns: 1fr !important; }
      .color-grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)) !important; }
      .set-tab-bar { flex-wrap: wrap !important; }
    }
    /* "All 10 Archetypes" grid: max 5 across when wide, never fewer than 2 when narrow */
    .archetype-grid-10 { display: grid; gap: 12px; align-self: stretch; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    @media (max-width: 1100px) { .archetype-grid-10 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 860px)  { .archetype-grid-10 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    /* phones: one box per row, so the color and archetype boxes stay readable */
    @media (max-width: 640px)  { .archetype-grid-10, .color-grid { grid-template-columns: 1fr !important; } }
    /* ---- shared site header (image + credits, matches other MTG project pages) ----
       Image referenced by ABSOLUTE Pages URL so it survives this file's folder
       location (it lives under mtg/, not the Pages root). See mtg/SHARED_HEADER_FOOTER.md. */
    .site-header { position: relative; border-radius: 12px; overflow: hidden;
      width: 100%; max-width: 900px; margin: 0 0 22px; box-shadow: 0 4px 6px rgba(0,0,0,.18);
      background-image: url('https://toskicologist.github.io/MTG-draft-sets-infographics/mtg/assets/cropped%20ChatGPT%20Image%20Jan%2018,%202026,%2010_33_59%20PM.png');
      background-size: cover; background-position: center; background-repeat: no-repeat; }
    .site-header::before { content: ''; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(135deg, rgba(102,126,234,.78) 0%, rgba(118,75,162,.78) 100%); }
    .site-header .header-content { position: relative; z-index: 2; padding: 26px 28px; color: #fff; }
    .site-header h1 { color: #fff; font-size: 28px; margin: 0 0 6px; text-align: center;
      text-shadow: 1px 1px 3px rgba(0,0,0,.4); font-weight: 700; }
    .site-header h1 span { color: rgba(255,255,255,.78); font-size: 12px; font-weight: 400; text-shadow: none; }
    .site-header .subtitle { text-align: center; color: rgba(255,255,255,.95); font-size: 14px; margin: 0 0 14px; line-height: 1.5; }
    .site-header .data-info { background: rgba(255,255,255,.13); padding: 11px 14px; border-radius: 8px;
      text-align: center; font-size: 12.5px; line-height: 1.7; color: rgba(255,255,255,.95); }
    .site-header .data-info a { color: #fff; text-decoration: underline; }
    .site-header .data-info a:hover { opacity: .85; }
    .site-header .data-info strong { color: #fff; font-weight: 600; }
    .site-header .data-info .sep { opacity: .45; margin: 0 6px; }
    .site-header .data-info .row { margin-top: 7px; }
    /* "Make your own!" CTA under the set tabs. Outlined rather than filled so it never reads
       as an eleventh set tab, and tinted with the active set's accentColor via --accent. */
    .make-your-own { display: inline-block; padding: 7px 18px; border-radius: 999px;
      border: 2px solid var(--accent, #6B7280); color: var(--accent, #374151);
      background: transparent; font-size: .85rem; font-weight: 700; text-decoration: none;
      cursor: pointer; transition: background-color .2s ease, color .2s ease, box-shadow .2s ease; }
    .make-your-own:hover, .make-your-own:focus-visible {
      background: var(--accent, #374151); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
    /* "All sets" view: small wheels, as many across as fit (one per row on a phone) */
    .all-wheels-grid { display: grid; gap: 18px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 1000px) { .all-wheels-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px)  { .all-wheels-grid { grid-template-columns: 1fr; } }
    .all-tab { border-left: 1px solid #D1D5DB !important; border-radius: 0 8px 8px 0 !important; }
    @media (max-width: 560px) {
      .site-header .header-content { padding: 20px 16px; }
      .site-header h1 { font-size: 22px; }
    }

/* LCARS display mode - shared base (mtg/lcars-mode/lcars-mode.css).
 *
 * Unofficial fan styling. Star Trek and LCARS are trademarks of CBS Studios / Paramount;
 * LCARS was designed by Michael Okuda. Palette: the named colors published by TheLCARS.com,
 * "Lower Decks" + "Lower Decks PADD" (the only style since 2026-11-05; the TNG "Classic"
 * palette was dropped). Font: Antonio (SIL Open
 * Font License 1.1, see Antonio-OFL.txt), embedded by the build as a data: URL so the page
 * makes no third-party font request.
 *
 * Everything is scoped under html.lcars, so the standard look is untouched. This file holds
 * only what every page shares: the palette roles, the font, the black page and the toggle
 * button. Each page maps its own layout onto the roles in its own stylesheet.
 *
 * Roles (use these in page rules, never raw hex):
 *   --lc-frame     elbows / main bars        --lc-frame-2, -3   other bar segments
 *   --lc-side-1..4 sidebar blocks            --lc-side-on       the active sidebar block
 *   --lc-fill      sidebar filler            --lc-text          body text on black
 *   --lc-head      headings / emphasis       --lc-link          links
 *   --lc-muted     secondary text            --lc-panel         dark panel / zebra rows
 *   --lc-high / --lc-low / --lc-controv / --lc-agree   top / bottom / disputed / agreed
 *   --lc-band-1..5 a 5-step scale, best (1) to worst (5)
 * Text on any colored block is black (--lc-on).
 */

html.lcars {
    /* Lower Decks + Lower Decks PADD */
    --lc-frame: #ff7700;    /* orange */
    --lc-frame-2: #ffaa44;  /* harvestgold */
    --lc-frame-3: #5588ee;  /* alpha-blue */
    --lc-side-1: #ffcc99;   /* honey */
    --lc-side-2: #ffaa44;   /* harvestgold */
    --lc-side-3: #ff9911;   /* daybreak */
    --lc-side-4: #99ccff;   /* arctic-snow */
    --lc-side-on: #ff7700;  /* orange */
    --lc-fill: #5588ee;     /* alpha-blue */
    --lc-text: #ffeecc;     /* butter */
    --lc-head: #ff9911;     /* daybreak */
    --lc-link: #99ccff;     /* arctic-snow */
    --lc-muted: #ffcc99;    /* honey */
    --lc-panel: #0a0f1c;
    --lc-rule: #455580;     /* night-rain */
    --lc-high: #66ccff;     /* arctic-ice */
    --lc-low: #ff4400;      /* october-sunset */
    --lc-controv: #ffaa44;  /* harvestgold */
    --lc-agree: #7799dd;    /* beta-blue */
    --lc-band-1: #66ccff;   /* arctic-ice */
    --lc-band-2: #99ccff;   /* arctic-snow */
    --lc-band-3: #ffeecc;   /* butter */
    --lc-band-4: #ffaa44;   /* harvestgold */
    --lc-band-5: #ff4400;   /* october-sunset */
    --lc-on: #000;
    --lc-font: 'Antonio', 'Arial Narrow', 'Roboto Condensed', sans-serif;
}

html.lcars body {
    background: #000;
    color: var(--lc-text);
    font-family: var(--lc-font);
