  <!-- GoatCounter PATTERN A: count the #hash so each set view (#hob, #msh, …) is its own dashboard path.
       The public count.js snippet is auto-injected at push time, just before the closing head tag; this
       inline config must run first, and does. NOTE: do NOT write the closing-head string literally in this
       comment — the injector inserts before the FIRST such string and would bury count.js inside the comment.
       See mtg/SHARED_HEADER_FOOTER.md "Analytics — GoatCounter". -->
  <script>
    window.goatcounter = {
      path: function () { return location.pathname + location.search + location.hash; }
    };
    addEventListener('hashchange', function () {
      if (window.goatcounter && window.goatcounter.count)
        window.goatcounter.count({ path: location.pathname + location.search + location.hash });
    });
  </script>

/* LCARS display mode - shared base (mtg/lcars-mode/lcars-mode.css).
 *
 * Unofficial fan styling. Star Trek and LCARS are trademarks of CBS Studios / Paramount;
 * LCARS was designed by Michael Okuda. Palette: the named colors published by TheLCARS.com,
 * "Lower Decks" + "Lower Decks PADD" (the only style since 2026-11-05; the TNG "Classic"
 * palette was dropped). Font: Antonio (SIL Open
 * Font License 1.1, see Antonio-OFL.txt), loaded from the published antonio-latin.woff2 on this
 * site (the @font-face is added by lcars-inline.js), so it is only fetched when LCARS shows.
 *
 * Everything is scoped under html.lcars, so the standard look is untouched. This file holds
 * only what every page shares: the palette roles, the font, the black page and the toggle
 * button. Each page maps its own layout onto the roles in its own stylesheet.
 *
 * Roles (use these in page rules, never raw hex):
 *   --lc-frame     elbows / main bars        --lc-frame-2, -3   other bar segments
 *   --lc-side-1..4 sidebar blocks            --lc-side-on       the active sidebar block
 *   --lc-fill      sidebar filler            --lc-text          body text on black
 *   --lc-head      headings / emphasis       --lc-link          links
 *   --lc-muted     secondary text            --lc-panel         dark panel / zebra rows
 *   --lc-high / --lc-low / --lc-controv / --lc-agree   top / bottom / disputed / agreed
 *   --lc-band-1..5 a 5-step scale, best (1) to worst (5)
 * Text on any colored block is black (--lc-on).
 */

html.lcars {
    /* Lower Decks + Lower Decks PADD */
    --lc-frame: #ff7700;    /* orange */
    --lc-frame-2: #ffaa44;  /* harvestgold */
    --lc-frame-3: #5588ee;  /* alpha-blue */
    --lc-side-1: #ffcc99;   /* honey */
    --lc-side-2: #ffaa44;   /* harvestgold */
    --lc-side-3: #ff9911;   /* daybreak */

    --lc-link: #99ccff;     /* arctic-snow */
    --lc-muted: #ffcc99;    /* honey */
    --lc-panel: #0a0f1c;
    --lc-rule: #455580;     /* night-rain */
    --lc-high: #66ccff;     /* arctic-ice */
    --lc-low: #ff4400;      /* october-sunset */

    --lc-band-3: #ffeecc;   /* butter */
    --lc-band-4: #ffaa44;   /* harvestgold */

  <script>
/* LCARS display mode - shared switch logic (mtg/lcars-mode/lcars-mode.js).
 *
 * One style only: Lower Decks LCARS (since 2026-11-05; the TNG "Classic" palette was dropped).
 * Inlined into a page's head by lcars-inline.js, BEFORE the body is parsed.
 *
 * "Wanted" = does the visitor want LCARS where a page offers it. Default ON. The choice is
 * remembered per browser (localStorage "mtg-lcars", one setting for the whole site); a link can
 * force it for one visit without saving: ?lcars (on) / ?lcars=off.
 * "Active" = is it showing right now. Pages decide when to apply it:
 *   - <html data-lcars-auto>: a page that is Star Trek throughout (TRK ratings) - applied at
 *     once, and any <button data-lcars-toggle> flips it (text from data-on-text / data-off-text).
 *   - otherwise (the color wheel, only on its TRK tab): the page calls MTGLcars.apply(bool)
 *     itself and MTGLcars.setWanted(bool) from its own button.
 * Never write the literal head-closing tag in this file: it is inlined into the head and the
 * push-time GoatCounter injector inserts before the first such string.
 */
(function () {
    var KEY = 'mtg-lcars';
    var root = document.documentElement;

    function fromQuery() {
        var m = /[?&]lcars(?:=([^&#]*))?/i.exec(window.location.search);
        if (!m) return null;
        var v = (m[1] || 'on').toLowerCase();
        return !(v === 'off' || v === '0' || v === 'false' || v === 'standard' || v === 'no');
    }
    function stored() {
        try { var v = window.localStorage.getItem(KEY); return v === '1' ? true : (v === '0' ? false : null); }
        catch (e) { return null; }
    }
    var forced = fromQuery(), saved = stored();
    var wanted = forced !== null ? forced : (saved !== null ? saved : true);
    var active = false, fontAsked = false;

    function syncButtons() {
        var btns = document.querySelectorAll('[data-lcars-toggle]');
        for (var i = 0; i < btns.length; i++) {
            btns[i].setAttribute('aria-pressed', active ? 'true' : 'false');
            var t = btns[i].getAttribute(active ? 'data-on-text' : 'data-off-text');
            if (t) btns[i].textContent = t;
        }
    }
    function apply(on) {
        active = !!on;
        if (active) root.classList.add('lcars'); else root.classList.remove('lcars');
        // The Antonio font is a separate file, fetched only when LCARS shows: ask for it now
        // rather than when the first LCARS text is laid out, after the page has rendered.
        if (active && !fontAsked && document.fonts && document.fonts.load) {
            fontAsked = true;
            document.fonts.load("400 16px 'Antonio'").catch(function () {});
        }
        syncButtons();
    }

    window.MTGLcars = {
        wanted: function () { return wanted; },
        isActive: function () { return active; },
        apply: apply,
        setWanted: function (on) {
            wanted = !!on;
            try { window.localStorage.setItem(KEY, wanted ? '1' : '0'); } catch (e) { /* private mode: this visit only */ }
            if (window.goatcounter && window.goatcounter.count)
                window.goatcounter.count({ path: 'lcars-' + (wanted ? 'on' : 'off'), title: 'LCARS display ' + (wanted ? 'on' : 'off'), event: true });
        }
    };

    var auto = root.hasAttribute('data-lcars-auto');
    if (auto) apply(wanted);

    document.addEventListener('DOMContentLoaded', function () {
        if (!auto) return;
        syncButtons();
        document.addEventListener('click', function (e) {
            var b = e.target && e.target.closest ? e.target.closest('[data-lcars-toggle]') : null;
            if (!b) return;
            window.MTGLcars.setWanted(!active);
            apply(wanted);
        });
    });
})();

  </script>
  <!-- LCARS-MODE:END -->
  <script>
    // LCARS is on by default on the TRK tab only. Apply it now, before React renders, when the URL
    // opens on that tab (#trk, or no hash: TRK is the default set while it is last in SET_ORDER) so
    // the page does not flash white; the component's effect keeps it right from then on.
    (function () {
      var h = location.hash.slice(1).toUpperCase();
      if (window.MTGLcars && (h === 'TRK' || h === '')) window.MTGLcars.apply(window.MTGLcars.wanted());
    })();
  </script>

llCodes:["ecl"],primaryArchetypes:["WU","BR","GW","UR","BG"],primaryLabel:"5 allied-pair archetypes",primaryDescription:"Lorwyn Eclipsed has an unusual set structure with 5 main typal archetypes (gold signpost uncommons, strong typal synergies) that beginners are encouraged to focus on, plus 5 secondary archetypes built around set mechanics.",accentColor:"#7C3AED",colorDescriptions:{W:{name:"White",description:"Kithkin tokens and go-wide strategies. Merfolk tap triggers and persist creatures for resilient threats. Partners with Blue (Merfolk) and Green (Kithkin)."},U:{name:"Blue",description:"Flash creatures (Faeries and Merfolk) for instant-speed trickery. Supports Elementals and enables vivid splashing. Partners with White (Merfolk) and Red (Elementals)."},B:{name:"Black",description:"Graveyard value with Elves and recursion. Goblins with blight and sacrifice synergies. Persist creatures for resilient threats. Partners with Red (Goblins) and Green (Elves)."},R:{name:"Red",description:"Aggressive Goblins with sacrifice payoffs. Big Elementals rewarding 4+ CMC spells. Vivid beatdown leveraging color diversity. Partners with Black (Goblins) and Blue (Elementals)."},G:{name:"Green",description:"Elf typal with graveyard synergies. Kithkin go-wide tokens. Vivid ramp enabling splashing and big threats. Partners with White (Kithkin) and Blue (Vivid ramp)."}},labels:{WU:{text:"Merfolk",sub:"Tap triggers",details:"Tricksy Merfolk disrupt opponents and accrue value over time. Key Merfolk have abilities that trigger when tapped. Convoke spells let you trigger these abilities without endangering creatures in combat.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/lorwyn-eclipsed-prerelease-guide"},UB:{text:"Flash",sub:"Trickery",details:"Play on your opponent's turn with flash creatures (mostly Faeries) and instants. This archetype rewards trickery and reactive play, ambushing attackers and controlling tempo through surprise.",sourceText:"Draftsim Set Review",sourceUrl:"https://draftsim.com/mtg-ecl-limited-set-review/"},BR:{text:"Goblins",sub:"Blight\nsacrifice",details:"Rambunctious Goblins combine with the blight mechanic. Goblins trigger powerful abilities when they die, rewarding aggressive sacrifice strategies and death triggers for overwhelming value.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/lorwyn-eclipsed-prerelease-guide"},RG:{text:"Vivid",sub:"Beatdown",details:"Vivid abilities care about the number of colors among your permanents. Thanks to hybrid mana, even 2-color decks can achieve all five colors. Play efficient beaters and leverage color diversity for bonuses.",sourceText:"Draftsim Set Review",sourceUrl:"https://draftsim.com/mtg-ecl-limited-set-review/"},GW:{text:"Kithkin",sub:"Go-wide tokens",details:"Swarm the board with Kithkin tokens and strengthen them with anthem effects and team buffs for an overwhelming board presence.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/lorwyn-eclipsed-prerelease-guide"},WB:{text:"Persist",sub:"Recursion",details:"Creatures with persist keep coming back with -1/-1 counters. Layer counter removal effects for repeated value and grind out opponents with resilient threats.",sourceText:"Draftsim Set Review",sourceUrl:"https://draftsim.com/mtg-ecl-limited-set-review/"},UR:{text:"Elementals",sub:"Big spells 4+",details:"Blue-red Elementals represent the four elements and reward casting big spells (CMC 4+). Can enable vivid for 3+ colors and splash cards effectively. Evoke for tempo.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/lorwyn-eclipsed-prerelease-guide"},BG:{text:"Elves",sub:"Graveyard\nvalue",details:"Elves fuel your graveyard and convert it into advantage. Recursion effects and death triggers create a value engine that snowballs over the game.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/lorwyn-eclipsed-prerelease-guide"},RW:{text:"-1/-1 Aggro",sub:"Counter removal",details:"Red-white takes big creatures that enter with a lot of -1/-1 counters and removes the counters to turn them into giant threats and clear the path to attack.",sourceText:"WotC Making Magic",sourceUrl:"https://magic.wizards.com/en/news/making-magic/total-eclipsed-of-the-sun"},GU:{text:"Vivid",sub:"Ramp",details:"Vivid cares about color diversity among your permanents. Ramp into big threats while accumulating multiple colors. Hybrid mana and color fixing enable splashing powerful cards for late-game advantage.",sourceText:"Draftsim Set Review",sourceUrl:"https://draftsim.com/mtg-ecl-limited-set-review/"}},resourceLinks:[{label:"Lorwyn Eclipsed Prerelease Guide",url:"https://magic.wizards.com/en/news/feature/lorwyn-eclipsed-prerelease-guide",desc:"Official Wizards of the Coast archetype overview and prerelease info",official:true},{label:"The Ultimate Lorwyn Eclipsed Limited Set Review",url:"https://draftsim.com/mtg-ecl-limited-set-review/",desc:"Draftsim's comprehensive card-by-card limited review"}]},FDN:{key:"FDN",name:"Foundations",shortName:"FDN",releaseDate:"November 15, 2024",version:"1.0.0",scryfallCodes:["fdn"],primaryArchetypes:["WU","UB","BR","RG","GW","WB","UR","BG","RW","GU"],primaryLabel:"All 10 archetypes supported",accentColor:"#3B82F6",colorDescriptions:{W:{name:"White",description:"Powers Flyers (WU), Lifegain (WB), Token Aggro (RW), and Counters (GW). White provides removal, life, and aggressive bodies to fuel multiple strategies."},U:{name:"Blue",description:"Supports Flyers (WU), Threshold (UB), Spellslinger (UR), and Ramp (GU). Blue's card draw and instants fuel spell-based and tempo strategies."},B:{name:"Black",description:"Supports Lifegain (WB), Threshold (UB), Raid Aggro (BR), and Morbid (BG). Black fills the graveyard and extracts value from creature deaths."},R:{name:"Red",description:"Supports Token Aggro (RW), Spellslinger (UR), Raid Aggro (BR), and Stompy (RG). Red attacks early and rewards combat and spell-casting."},G:{name:"Green",description:"Supports Counters (GW), Ramp/Big (GU), Morbid (BG), and Stompy (RG). Green ramps into oversized threats and buffs creatures with +1/+1 counters."}},labels:{WU:{text:"Azorius",sub:"Flying\nTempo",details:"Race in the air with flyers\u2014Serra Angel, Dazzling Angel, Empyrean Eagle\u2014while slowing opponents with bounce and removal. Empyrean Eagle is the key payoff, boosting all flyers.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"},UB:{text:"Dimir",sub:"Threshold\nControl",details:"Fill your graveyard to 7 cards (Threshold). Classic Dimir control backed by card draw, discard, and removal. Tolarian Terror becomes cheap with enough spells in the yard.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"},BR:{text:"Rakdos",sub:"Raid\nAggro",details:"The classic pile of creatures and removal. Raid rewards attacking each turn\u2014easy to trigger when you're already playing aggressively. Kill anything that blocks and keep the pressure on.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"},RG:{text:"Gruul",sub:"Big Stompy\n4-Power+",details:"GRUUL SMASH! Deploy large creatures and turn them sideways. The 4-power-matters theme is easy to satisfy in a deck full of big green and red creatures.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"},GW:{text:"Selesnya",sub:"+1/+1\nCounters",details:"Go tall with +1/+1 counters. Gnarlid Colony grants trample to counter-laden creatures. Wildwood Scourge scales up with each counter placed.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"},WB:{text:"Orzhov",sub:"Lifegain\nPayoffs",details:"Gain life to trigger payoffs. The dream: Healer's Hawk \u2192 Ajani's Pridemate. Marauding Blight-Priest punishes the opponent every time you gain life.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"},UR:{text:"Izzet",sub:"Spell-\nslinger",details:"Cast instants and sorceries for prowess-style effects. Balmor pumps the whole team. Tolarian Terror is near-free with spells in the graveyard. Firebrand Archer is a classic payoff.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"},BG:{text:"Golgari",sub:"Morbid\nGrind",details:"Trigger Morbid by having creatures die\u2014trade profitably, sacrifice, or let opponents do the work. Classic Golgari grind: never run out of threats, generate value from every death.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"},RW:{text:"Boros",sub:"Token\nAggro",details:"Deploy cheap creatures and pump the whole team. Heroic Reinforcements is CRACKED\u2014extra creature AND +1/+1 for everyone at instant speed. Flood the board and end games quickly.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"},GU:{text:"Simic",sub:"Ramp &\nBig Creatures",details:"Accelerate with mana ramp into oversized threats. Llanowar Elves enables early big plays. Koma, Cosmos Serpent is the top payoff\u2014the biggest win condition in the format.",sourceText:"MTGArenaZone / Card Game Base",sourceUrl:"https://cardgamebase.com/foundations-draft-guide/"}},resourceLinks:[{label:"Foundations Prerelease Guide",url:"https://magic.wizards.com/en/news/feature/foundations-prerelease-guide",desc:"Official Wizards of the Coast prerelease overview",official:true},{label:"Foundations Draft Guide",url:"https://cardgamebase.com/foundations-draft-guide/",desc:"Card Game Base's archetype breakdowns and pick priorities"},{label:"The Foundations Draft Guide",url:"https://blog.cardkingdom.com/the-foundations-draft-guide/",desc:"Card Kingdom's draft strategy and archetype analysis"}]},TMT:{key:"TMT",name:"Teenage Mutant Ninja Turtles",shortName:"TMT",releaseDate:"March 6, 2026",version:"1.0.4",scryfallCodes:["tmt"],primaryArchetypes:["WB","UR","BG","RW","GU"],primaryLabel:"5 enemy-pair archetypes",accentColor:"#10B981",colorDescriptions:{W:{name:"White",description:"Sneaky ninjas and Alliance go-wide. Leonardo's Foot Clan discipline and Sally Pride's coalition-building. Partners with Black (Sneak) and Red (Alliance)."},U:{name:"Blue",description:"Artifact machines and Mutagen science. Donatello's technology drives artifact synergies. Partners with Red (Machines) and Green (Mutagen tokens)."},B:{name:"Black",description:"Ninja deception and Disappear triggers. When your permanents leave the battlefield, generate value. Partners with White (Sneak) and Green (Disappear)."},R:{name:"Red",description:"Aggressive Alliance and artifact combat. Raphael's raw attitude fuels attack triggers. Partners with White (Alliance) and Blue (Machines)."},G:{name:"Green",description:"Mutagen tokens and graveyard Disappear. Mutant creatures grow and multiply. Partners with Blue (Mutagen) and Black (Disappear value)."}},labels:{WB:{text:"Ninjas",sub:"Sneak",details:"Sneak mechanic replaces unblocked creatures with stronger ninja threats from hand or library. Leonardo and Splinter lead disciplined strike forces that attack from the shadows. Overwhelming tempo when sneaks resolve.",sourceText:"WotC / Draftsim / TheGamer",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"},UR:{text:"Machines",sub:"Artifacts",details:"Donatello's lab powers artifact-heavy Blue/Red decks. Technodrome, robots, and gadgets generate value and board presence. One of the stronger archetypes\u2014combine artifact synergies with aggressive Red threats.",sourceText:"WotC / Draftsim / TheGamer",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"},BG:{text:"Ooze",sub:"Disappear",details:"Disappear triggers when your permanents leave the battlefield, generating value through sacrifice and removal. Michelangelo's chaos and the ooze subtype create recursive value loops. Great at grinding out opponents.",sourceText:"WotC / Draftsim / GameDaily",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"},RW:{text:"Alliance",sub:"Go-wide tokens",details:"Alliance is a returning mechanic that triggers whenever another creature enters under your control. Stack creature-count payoffs, go wide with tokens, and overwhelm opponents. Recommended for newer players\u2014straightforward and powerful.",sourceText:"WotC / Draftsim / TheGamer",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"},GU:{text:"Mutagen",sub:"Mutant tokens",details:"Mutagen tokens represent the ooze that transforms ordinary creatures into mutants. One of the stronger archetypes\u2014grow enormous mutant threats while accumulating incremental value. The Mutagen Man epitomizes this strategy.",sourceText:"WotC / Draftsim / TheGamer",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"},WU:{text:"Off-arch",sub:"Splash W/U",details:"No dedicated WU archetype in TMT. Bridges Ninjas (WB) and Machines (UR). Splash for powerful individual cards\u2014Krang Master Mind (U), Sally Pride (W) are exceptional off-color inclusions.",sourceText:"Draftsim pre-release review",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"},UB:{text:"Off-arch",sub:"Splash U/B",details:"No dedicated UB archetype. Bridges Machines (UR) and Ooze/Disappear (BG). April O'Neil works in either direction. Splashing strong black removal or blue card draw is viable.",sourceText:"Draftsim pre-release review",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"},BR:{text:"Off-arch",sub:"Splash B/R",details:"No dedicated BR archetype. Bridges Ooze (BG) and Alliance (RW). Raphael cards span both colors. Aggressive black/red builds can work with creature-based removal and direct pressure.",sourceText:"Draftsim pre-release review",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"},RG:{text:"Off-arch",sub:"Splash R/G",details:"No dedicated RG archetype. Bridges Alliance (RW) and Mutagen (GU). Green ramp into red threats is viable. Groundchuck & Dirtbag provide Mutagen-adjacent value in non-dedicated builds.",sourceText:"Draftsim pre-release review",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"},GW:{text:"Off-arch",sub:"Splash G/W",details:"No dedicated GW archetype. Bridges Mutagen (GU) and Ninja/Alliance (WB, RW). Sally Pride's Alliance payoffs pair naturally with green's wide board. Token-heavy GW shells can work around Alliance triggers.",sourceText:"Draftsim pre-release review",sourceUrl:"https://draftsim.com/mtg-tmt-limited-set-review/"}},resourceLinks:[{label:"TMT Limited Set Review",url:"https://draftsim.com/mtg-tmt-limited-set-review/",desc:"Draftsim's comprehensive card-by-card limited review"},{label:"How To Draft MTG TMNT",url:"https://www.thegamer.com/magic-the-gathering-teenage-mutant-ninja-turtles-best-draft-archetypes/",desc:"TheGamer's archetype tier list and draft strategy"}]},SOS:{key:"SOS",name:"Secrets of Strixhaven",shortName:"SOS",releaseDate:"April 24, 2026",version:"1.0.2",scryfallCodes:["sos"],primaryArchetypes:["WB","UR","BG","RW","GU"],primaryLabel:"5 College archetypes (enemy pairs)",accentColor:"#8B5CF6",colorDescriptions:{W:{name:"White",description:"Home to Silverquill (WB) and Lorehold (RW). Silverquill targets creatures with repartee spells\u2014combat tricks or removal\u2014to press the attack. Lorehold fills the graveyard and excavates it with flashback for history-making plays."},U:{name:"Blue",description:"Home to Prismari (UR) and Quandrix (GU). Prismari loads up on instants and sorceries, earning opus bonuses for spending 5+ mana. Quandrix grows creatures via increment\u2014casting spells with mana value exceeding creature stats."},B:{name:"Black",description:"Home to Silverquill (WB) and Witherbloom (BG). Silverquill hurls cutting critiques with targeted removal. Witherbloom builds a Pest army and converts lifegain into infusion-boosted spell effects."},R:{name:"Red",description:"Home to Prismari (UR) and Lorehold (RW). Prismari paints the battlefield with cheap spells or showstopping 5+ mana opus plays. Lorehold digs up the graveyard with flashback for powerful recursive aggression."},G:{name:"Green",description:"Home to Witherbloom (BG) and Quandrix (GU). Witherbloom overwhelms with Pests and infusion-boosted spells. Quandrix grows creatures with +1/+1 counters via increment as you cast bigger and bigger spells."}},labels:{WU:{text:"Off-College",sub:"Jeskai (WUR) Wedge",wedge:"Jeskai",details:"Home to Lorehold (RW) and Prismari (UR). Lorehold fills the graveyard and excavates it with flashback for history-making plays. Prismari loads up on instants and sorceries, earning opus bonuses for spending 5+ mana."},UB:{text:"Off-College",sub:"Sultai (UBG) Wedge",wedge:"Sultai",details:"Home to Witherbloom (BG) and Quandrix (GU). Witherbloom builds a Pest army and converts lifegain into infusion-boosted spell effects. Quandrix grows creatures via increment\u2014casting spells with mana value exceeding creature stats."},BR:{text:"Off-College",sub:"Mardu (BRW) Wedge",wedge:"Mardu",details:"Home to Silverquill (WB) and Lorehold (RW). Silverquill targets creatures with repartee spells\u2014combat tricks or removal\u2014to press the attack. Lorehold fills the graveyard and excavates it with flashback for history-making plays."},RG:{text:"Off-College",sub:"Temur (RGU) Wedge",wedge:"Temur",details:"Home to Quandrix (GU) and Prismari (UR). Quandrix grows creatures with +1/+1 counters via increment as you cast bigger and bigger spells. Prismari loads up on instants and sorceries, earning opus bonuses for spending 5+ mana."},GW:{text:"Off-College",sub:"Abzan (GWB) Wedge",wedge:"Abzan",details:"Home to Silverquill (WB) and Witherbloom (BG). Silverquill targets creatures with repartee spells\u2014combat tricks or removal\u2014to press the attack. Witherbloom overwhelms with Pests and infusion-boosted spells."},WB:{text:"Silverquill",sub:"Repartee\nAggro",details:"Cards with repartee trigger when you target creatures\u2014complement your own with combat tricks or target opponents' creatures with removal. Balance creatures to target and spells to target them with. Creatures with prepared spells like Scathing Shadelock are especially valuable.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-prerelease-guide",mechanic:"repartee",mechanicDef:"Repartee \u2014 Triggered abilities that trigger whenever you cast an instant or sorcery spell targeting a creature."},UR:{text:"Prismari",sub:"Opus\nSpellcasting",details:"The opus mechanic rewards casting instants and sorceries for 5+ mana with showstopping bonuses. Use mana producers like Abstract Paintmage and Rapturous Moment to fuel big plays. Cards with X in their mana cost work early or late for full opus benefit.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-prerelease-guide",mechanic:"opus",mechanicDef:"Opus \u2014 Abilities that trigger when you cast an instant or sorcery, with an enhanced effect if five or more mana was spent to cast it."},BG:{text:"Witherbloom",sub:"Infusion\nSwarm",details:"Turn your life into your opponent's death with infusion, which triggers when you gain life. Pest tokens attack and trigger your infusion cards. Pestbrood Sloth and Lluwen, Exchange Student are skilled at sourcing Pests.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-prerelease-guide",mechanic:"infusion",mechanicDef:"Infusion \u2014 Abilities that trigger or gain bonuses if you've gained life this turn."},RW:{text:"Lorehold",sub:"Flashback\nExcavation",details:"Cast flashback spells from hand, then again from your graveyard. Discard flashback cards to Pursue the Past for value, then recast them. Assemble archeologists like Owlin Historian and Garrison Excavator that trigger when cards leave your graveyard.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-prerelease-guide",mechanic:"flashback",mechanicDef:"Flashback \u2014 Cast instant and sorcery spells from your graveyard by paying their flashback cost, then exile them."},GU:{text:"Quandrix",sub:"Increment\nValue",details:"The increment mechanic adds +1/+1 counters when you cast spells with greater mana value than a creature's power or toughness. Deploy Cuboid Colony early, then grow it with massive spells. Look for evasion like Emil, Vastlands Roamer to push damage through.",sourceText:"WotC Prerelease Guide",sourceUrl:"https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-prerelease-guide",mechanic:"increment",mechanicDef:"Increment \u2014 When you cast a spell, if the mana spent exceeds this creature's power or toughness, put a +1/+1 counter on it."}},resourceLinks:[{label:"Secrets of Strixhaven Prerelease Guide",url:"https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-prerelease-guide",desc:"Official Wizards of the Coast archetype overview, college mechanics, and prerelease info",official:true},{label:"SOS Limited Set Review",url:"https://draftsim.com/mtg-sos-limited-set-review/",desc:"Draftsim's comprehensive card-by-card limited review"},{label:"How To Draft Secrets of Strixhaven",url:"https://www.thegamer.com/magic-the-gathering-secrets-of-strixhaven-best-draft-archetypes/",desc:"TheGamer's college archetype tier list and draft strategy guide"},{label:"Every Mechanic from Secrets of Strixhaven, Explained",url:"https://draftsim.com/mtg-secrets-of-strixhaven-mechanics/",desc:"Draftsim's breakdown of repartee, opus, infusion, flashback, increment, prepared, and converge"},{label:"Everything You Need to Know About the SOS Prerelease",url:"https://draftsim.com/mtg-secrets-of-strixhaven-prerelease/",desc:"Draftsim's prerelease preparation guide and format expectations"},{label:"MTG Prerelease Guide: Secrets of Strixhaven",url:"https://cardgamebase.com/mtg-prerelease-guide-secrets-of-strixhaven/",desc:"Card Game Base's prerelease tips and college overviews"},{label:"Secrets of Strixhaven First Look",url:"https://blog.cardkingdom.com/secrets-of-strixhaven-first-look-blog/",desc:"Card Kingdom's initial analysis of set themes and college strategies"}],setMechanics:[{name:"Prepared",keyword:"prepared",description:"Some creatures enter the battlefield prepared, exiling a spell from the set. While the creature is prepared, you may cast a copy of that spell. Casting it causes the creature to become unprepared. Prepared creatures carry extra value as both a body and a spell.",source:"WotC Mechanics",sourceUrl:"https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-mechanics"},{name:"Converge",keyword:"converge",description:"Converge spells count the number of different colors of mana spent to cast them, scaling their effect from 0 to 5. Even in a two-color deck, fixing and treasure tokens can push your converge count higher for stronger payoffs.",source:"WotC Mechanics",sourceUrl:"https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-mechanics"},{name:"Paradigm",keyword:"paradigm",description:"A keyword on a cycle of Lesson sorceries, one per college. The first time it resolves, exile it. From then on, at the beginning of each of your first main phases, you may cast a copy without paying its mana cost. Unlike the old Epic mechanic, you can still cast other spells normally.",source:"WotC Mechanics",sourceUrl:"https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-mechanics"}]},MSH:{key:"MSH",name:"Marvel Super Heroes",shortName:"MSH",releaseDate:"June 26, 2026",version:"1.1.0",scryfallCodes:["msh"],primaryArchetypes:["WU","UB","BR","RG","GW","WB","UR","BG","RW","GU"],primaryLabel:"All 10 archetypes supported",accentColor:"#ED1D24",colorDescriptions:{W:{name:"White",description:"\nTop commons:\nWeb Up; Hero in Training; Take Up the Shield.\nTop uncommons:\nNight Nurse, Healer of Heroes; Okoye, Dora Milaje Leader; Agent Maria Hill.\nTop Rares and mythics:\nAgent Phil Coulson; Captain America, Wings of Freedom; Origin of the Avengers; Captain Marvel, Earth's Protector; Avengers Assemble!; Captain America, Super-Soldier.",cards:["Web Up","Hero in Training","Take Up the Shield","Night Nurse, Healer of Heroes","Okoye, Dora Milaje Leader","Agent Maria Hill","Agent Phil Coulson","Captain America, Wings of Freedom","Origin of the Avengers","Captain Marvel, Earth's Protector","Avengers Assemble!","Captain America, Super-Soldier"]},U:{name:"Blue",description:"\nTop commons:\nS.H.I.E.L.D. Deployment Drone; We Say Thee Nay!; Trickster's Stratagem.\nTop uncommons:\nJustice, Vance Astrovik; Falcon, Winged Wonder; Iron Lad, Diverging Destiny.\nTop Rares and mythics:\nLeader, Super-Genius; Secret Invasion; S.H.I.E.L.D. Flying Car; Kang the Conqueror; Namor the Sub-Mariner; Multiversal Incursion.",cards:["S.H.I.E.L.D. Deployment Drone","We Say Thee Nay!","Trickster's Stratagem","Justice, Vance Astrovik","Falcon, Winged Wonder","Iron Lad, Diverging Destiny","Leader, Super-Genius","Secret Invasion","S.H.I.E.L.D. Flying Car","Kang the Conqueror","Namor the Sub-Mariner","Multiversal Incursion"]},B:{name:"Black",description:"\nTop commons:\nHour of Defeat; Cruel Alliance; Agents of HYDRA.\nTop uncommons:\nDark Deed; Madame Masque; Klaw, Sonic Subjugator.\nTop Rares and mythics:\nElektra, Daughter of the Hand; Super-Skrull; Construct a Cosmic Cube; Doctor Doom; Black Widow, Super Spy; M.O.D.O.K..",cards:["Hour of Defeat","Cruel Alliance","Agents of HYDRA","Dark Deed","Madame Masque","Klaw, Sonic Subjugator","Elektra, Daughter of the Hand","Super-Skrull","Construct a Cosmic Cube","Doctor Doom","Black Widow, Super Spy","M.O.D.O.K."]},R:{name:"Red",description:"\nTop commons:\nLightning Strike; HULK SMASH!; Repulsor Blast.\nTop uncommons:\nPhoton Blast Barrage; Iron Fist, Living Weapon; Truck Toss.\nTop Rares and mythics:\nHawkeye, Master Marksman; Avengers Disassembled; Fin Fang Foom; Thor, God of Thunder; Mj\xF6lnir, Hammer of Thor.",cards:["Lightning Strike","HULK SMASH!","Repulsor Blast","Photon Blast Barrage","Iron Fist, Living Weapon","Truck Toss","Hawkeye, Master Marksman","Avengers Disassembled","Fin Fang Foom","Thor, God of Thunder","Mj\xF6lnir, Hammer of Thor"]},G:{name:"Green",description:"\nTop commons:\nUndercover Skrull; Go Nuts!; Pet Avengers.\nTop uncommons:\nKa-Zar of the Savage Land; White Tiger, Ava Ayala; Punishing Punch.\nTop Rares and mythics:\nThe Unbeatable Squirrel Girl; Epic Fight; Mole Man, Moloid Master; Shang-Chi, Master of Kung Fu; Earth's Mightiest Heroes.",cards:["Undercover Skrull","Go Nuts!","Pet Avengers","Ka-Zar of the Savage Land","White Tiger, Ava Ayala","Punishing Punch","The Unbeatable Squirrel Girl","Epic Fight","Mole Man, Moloid Master","Shang-Chi, Master of Kung Fu","Earth's Mightiest Heroes"]}},labels:{WU:{text:"Teamwork",sub:"Tap synergy\nMidrange",details:"Tap your team to pay teamwork costs on instants and sorceries for upgraded or additional effects, then profit from tap payoffs like Agent Maria Hill.\nCards: Captain America, Living Legend; Spider-Woman, Secret Agent; Agent Maria Hill; Murdock's Crusade.",cards:["Captain America, Living Legend","Spider-Woman, Secret Agent","Agent Maria Hill","Murdock's Crusade"],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide",mechanic:"teamwork",mechanicDef:"Teamwork N \u2014 \"As an additional cost to cast this spell, you may tap any number of creatures you control with total power N or more.\" Paying it upgrades the spell's effect or adds a bonus effect."},UB:{text:"Draw 2nd Card",sub:"Connive\nControl",details:"Cares about drawing your second card each turn, mostly via connive. Kang is both enabler and payoff for the strategy.\nCards: Kang, Temporal Tyrant; Ghost, Spectral Saboteur; Construct a Cosmic Cube; Leader, Super-Genius.",cards:["Kang, Temporal Tyrant","Ghost, Spectral Saboteur","Construct a Cosmic Cube","Leader, Super-Genius"],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide",mechanic:"connive",mechanicDef:"Connive \u2014 \"Draw a card, then discard a card. If you discarded a nonland card, put a +1/+1 counter on this creature.\""},BR:{text:"Villains",sub:"Aggro",details:"Draft as many Villains as possible \u2014 payoffs trigger when other Villains enter play (69 Villain cards in the set). Connive plays a small supporting role. An aggressive engine deck.\nCards: Madame Hydra; Bullseye, Death Dealer; The Masters of Evil; Doom Reigns Supreme.",cards:["Madame Hydra","Bullseye, Death Dealer","The Masters of Evil","Doom Reigns Supreme"],themeSearches:[{label:"Villains",url:"https://scryfall.com/search?q=set%3Amsh+t%3Avillain&unique=cards&as=grid&order=name"}],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide"},RG:{text:"Power-Up",sub:"Big creatures\nAggro",details:"Large creatures plus power-up abilities as mana sinks \u2014 turn Hulk into an 11/10 and SMASH.\nCards: Hulk, Gamma Goliath; Abomination, Terrifying Titan; HULK SMASH!; Doc Samson, Super Psychiatrist.",cards:["Hulk, Gamma Goliath","Abomination, Terrifying Titan","HULK SMASH!","Doc Samson, Super Psychiatrist"],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide",mechanic:"power-up",mechanicDef:"Power-up \u2014 One-shot activated abilities that put +1/+1 counters on the creature. \"Activate each power-up ability only once. Reduce the cost by its mana cost if it entered this turn.\""},GW:{text:"Heroes",sub:"Go-wide",details:"Hero typal go-wide \u2014 payoffs trigger when Heroes enter play (91 Hero cards in the set). Swarm the board and overwhelm.\nCards: Black Panther, Vanguard; Spider-Man, To the Rescue; Agent Phil Coulson; Avengers Assemble!",cards:["Black Panther, Vanguard","Spider-Man, To the Rescue","Agent Phil Coulson","Avengers Assemble!"],themeSearches:[{label:"Heroes",url:"https://scryfall.com/search?q=set%3Amsh+t%3Ahero&unique=cards&as=grid&order=name"}],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide"},WB:{text:"Attack\nAlone",sub:"Tempo",details:"Rewards attacking with a single creature \u2014 buffs, evasion, and value triggers for solo strikes.\nCards: Black Widow, Double Agent; U.S.Agent, John Walker; Agent 13, Sharon Carter; Luke Cage, Power Man.",cards:["Black Widow, Double Agent","U.S.Agent, John Walker","Agent 13, Sharon Carter","Luke Cage, Power Man"],themeSearches:[{label:"Lone attackers",url:"https://scryfall.com/search?q=otag%3Asynergy-solo-attack+set%3AMSH&unique=cards&as=grid&order=name"}],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide"},UR:{text:"Artifacts",sub:"Midrange",details:"Artifact-matters: equipment, vehicles, and artifact creatures all count. Iron Man leads the lab.\nCards: Iron Man, Master of Machines; Speedball, New Warrior; Shuri, Wakandan Inventor; Armor Wars.",cards:["Iron Man, Master of Machines","Speedball, New Warrior","Shuri, Wakandan Inventor","Armor Wars"],themeSearches:[{label:"Artifacts",url:"https://scryfall.com/search?q=set%3Amsh+t%3Aartifact&unique=cards&as=grid&order=name"},{label:"Artifact synergy",url:"https://scryfall.com/search?q=otag%3Asynergy-artifact+set%3Amsh&unique=cards&as=grid&order=name"}],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide"},BG:{text:"Creatures in GY",sub:"2+ in yard\nMidrange",details:"Threshold-style: cards get better once two or more creature cards sit in your graveyard. Self-mill and profitable trades fuel it.\nCards: Killmonger, Scourge of Wakanda; Titania, Rugged Rumbler; HYDRA Troopers; Punishing Punch.",cards:["Killmonger, Scourge of Wakanda","Titania, Rugged Rumbler","HYDRA Troopers","Punishing Punch"],themeSearches:[{label:"Graveyard matters",url:"https://scryfall.com/search?q=set%3Amsh+otag%3Acards-in-graveyard-matter&unique=cards&as=grid&order=name"}],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide"},RW:{text:"Noncreature\nSpells",sub:"Aggro",details:"The classic Izzet spells deck moved to Boros: prowess-style payoffs for casting noncreature spells, with an equipment subtheme.\nCards: Thor Odinson; War Machine, Legacy of Iron; Iron Fist, Living Weapon; Colleen Wing, Street Samurai.",cards:["Thor Odinson","War Machine, Legacy of Iron","Iron Fist, Living Weapon","Colleen Wing, Street Samurai"],themeSearches:[{label:"Spell synergy",url:"https://scryfall.com/search?q=%28otag%3Asynergy-noncreature+OR+otag%3Asynergy-instant%29+set%3Amsh&unique=cards&as=grid&order=name"}],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide"},GU:{text:"+1/+1\nCounters",sub:"Midrange",details:"+1/+1 counter generation and payoffs, fed by power-up, teamwork, and connive counters from across the set.\nCards: Ant-Man, Colony Commander; Beast, Erudite Aerialist; Hellcat, Undying Vigilante; Go Nuts!",cards:["Ant-Man, Colony Commander","Beast, Erudite Aerialist","Hellcat, Undying Vigilante","Go Nuts!"],themeSearches:[{label:"Counters matter",url:"https://scryfall.com/search?q=otag%3Acounters-matter+set%3Amsh&unique=cards&as=grid&order=name"}],sourceText:"WotC Prerelease Guide / Draftsim",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide"}},resourceLinks:[{label:"Marvel Super Heroes Prerelease Guide",url:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-prerelease-guide",desc:"Official Wizards of the Coast archetype guide \u2014 all 10 two-color pairs with signpost cards",official:true},{label:"Marvel Super Heroes Mechanics",url:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-mechanics",desc:"Official Wizards of the Coast mechanics breakdown (teamwork, power-up, connive, Plans)",official:false},{label:"Marvel Super Heroes Release Notes",url:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-release-notes",desc:"Official Wizards of the Coast release notes (detailed rulings, double-faced cards)",official:false},{label:"Exploring All 10 Marvel Super Heroes Limited Archetypes",url:"https://draftsim.com/mtg-msh-draft-archetypes-6-3-26/",desc:"Draftsim's archetype-by-archetype breakdown with signpost cards"},{label:"MSH Draft Archetypes To Look Out For",url:"https://www.thegamer.com/magic-the-gathering-marvel-super-heroes-draft-archetypes/",desc:"TheGamer's archetype overview"}],setMechanics:[{name:"Teamwork",keyword:"teamwork",description:"An optional additional cost on instants and sorceries (12 cards): tap any number of untapped creatures you control with total power N or more. Paying it upgrades the spell's effect or unlocks a bonus effect. Centered in WU but appears across white and blue.",source:"WotC Mechanics",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-mechanics"},{name:"Power-up",keyword:"power-up",description:"One-shot activated abilities (24 cards) that put +1/+1 counters on the creature: \"Activate each power-up ability only once. Reduce the cost by its mana cost if it entered this turn.\" Centered in RG/GU but appears in all colors.",source:"WotC Mechanics",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-mechanics"},{name:"Connive",keyword:"connive",description:"Returning mechanic (11 cards): \"Draw a card, then discard a card. If you discarded a nonland card, put a +1/+1 counter on this creature.\" Centered in UB with a smaller BR presence.",source:"WotC Mechanics",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-mechanics"},{name:"Plans",keyword:"plan",description:"Enchantments that build toward an ultimate reward: a triggered ability puts plan counters on the enchantment as you meet its condition; when the fourth plan counter is placed, sacrifice it and unlock the payoff (e.g. Political Triumph, Rewrite History).",cards:["Political Triumph","Rewrite History"],source:"WotC Mechanics",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-mechanics"},{name:"Modal / Transforming Double-Faced Cards",description:"Five modal double-faced cards (e.g. Bruce Banner // The Incredible Hulk, Tony Stark // The Invincible Iron Man) have two faces, and you choose which to cast. Per the release notes, this set's modal DFCs can also transform during play \u2014 flipping the alter ego to the more powerful hero side.",cards:["Bruce Banner // The Incredible Hulk","Tony Stark // The Invincible Iron Man"],source:"WotC Release Notes",sourceUrl:"https://magic.wizards.com/en/news/feature/marvel-super-heroes-release-notes",scryfallQuery:"https://scryfall.com/search?q=set%3Amsh+is%3Amdfc&unique=cards&as=grid&order=rarity",scryfallLabel:"is:mdfc"}]},HOB:{key:"HOB",name:"The Hobbit",shortName:"HOB",releaseDate:"August 14, 2026",version:"1.0.0",scryfallCodes:["hob"],primaryArchetypes:["WU","BR","BG","RW","GU"],primaryLabel:"Only 5 archetypes supported",primaryDescription:"The Hobbit is a smaller set that supports just five two-color archetypes rather than the usual ten. The remaining five pairs (UB, RG, GW, WB, UR) have no gold cards at all and no signpost uncommons, so they are shown blank. Each supported pair gets a signpost uncommon, a common creature, a dual land, and a \"Company\" rare.",accentColor:"#2E7D32",colorDescriptions:{W:{name:"White",description:"Humans and Dwarves. Feeds Draw Two (WU) with recruit tokens and Storied (RW) with legendary Dwarves and Sagas. White supplies the 1/1 Human Soldier go-wide bodies that recruit generates."},U:{name:"Blue",description:"Card draw and Elves. Feeds Draw Two (WU) by making the second draw each turn trivial, and Landfall (GU) with raft-steerers and ramp payoffs. Blue holds most of the set's explicit \"second card\" triggers."},B:{name:"Black",description:"Goblins and big predators. Feeds Amass Goblins (BR) with the bulk of the set's amass cards, and Ferocious (BG) with hunters that want a power-4 creature around."},R:{name:"Red",description:"Goblins and Dwarves. Feeds Amass Goblins (BR) with aggressive raiders, and Storied (RW) with legendary Dwarves, Equipment and hone counters."},G:{name:"Green",description:"Elves, beasts and lands. Feeds Ferocious (BG) with power-4 threats and Landfall (GU) with extra land drops. Green has the set's largest creatures and its ramp."}},labels:{WU:{text:"Draw Two",sub:"Humans\nRecruit",details:"Drawing a second card each turn is the payoff, and the new recruit mechanic is the enabler \u2014 it draws, discards, and leaves a 1/1 Human Soldier behind when you pitch a nonland card. Go wide with Soldiers while the draw triggers accrue value.\nCards: Bard the Bowman; The Queen of Dale; Patient Instructor; Master's Councillors.",cards:["Bard the Bowman","The Queen of Dale","Patient Instructor","Master's Councillors"],themeSearches:[{label:"Second-card payoffs",url:"https://scryfall.com/search?q=set%3Ahob+%28o%3A%22second+card%22+OR+otag%3Asecond-draw-matters%29&unique=cards&as=grid&order=name"},{label:"Humans",url:"https://scryfall.com/search?q=set%3Ahob+t%3Ahuman&unique=cards&as=grid&order=name"}],sourceText:"Draftsim",sourceUrl:"https://draftsim.com/mtg-hob-draft-archetypes/",sourceText2:"WotC Mechanics",sourceUrl2:"https://magic.wizards.com/en/news/feature/the-hobbit-mechanics",mechanic:"recruit",mechanicDef:"Recruit \u2014 \"Draw a card, then discard a card. If you discarded a nonland card, create a 1/1 white Human Soldier creature token.\""},UB:{text:"",sub:"",details:"",cards:[],unsupported:true},BR:{text:"Amass\nGoblins",sub:"Aggro",details:"Amass returns building Goblin Armies instead of Orc ones. Pile +1/+1 counters onto a single 0/0 black Goblin Army token, then back it with Goblin typal payoffs and Equipment.\nCards: Bolg of the North; The Great Goblin; Fearsome Goblin Pair; Goblin Plate Mail.",cards:["Bolg of the North","The Great Goblin","Fearsome Goblin Pair","Goblin Plate Mail"],themeSearches:[{label:"Goblins",url:"https://scryfall.com/search?q=set%3Ahob+t%3Agoblin&unique=cards&as=grid&order=name"}],sourceText:"Draftsim",sourceUrl:"https://draftsim.com/mtg-hob-draft-archetypes/",sourceText2:"WotC Mechanics",sourceUrl2:"https://magic.wizards.com/en/news/feature/the-hobbit-mechanics",mechanic:"amass",mechanicDef:"Amass Goblins N \u2014 \"To amass Goblins N, put N +1/+1 counters on an Army you control. It's also a Goblin. If you don't control an Army, create a 0/0 black Goblin Army creature token first.\""},RG:{text:"",sub:"",details:"",cards:[],unsupported:true},GW:{text:"",sub:"",details:"",cards:[],unsupported:true},WB:{text:"",sub:"",details:"",cards:[],unsupported:true},UR:{text:"",sub:"",details:"",cards:[],unsupported:true},BG:{text:"Ferocious",sub:"Power 4+\nMidrange",details:"Ferocious asks you to control a creature with power 4 or greater, then rewards you for it. Wolves, bears and trolls supply the bodies; the payoffs turn them into card advantage.\nCards: The Chief Warg; Tom, Bert, and William; Duskwatch Hunter; Large Bear.",cards:["The Chief Warg","Tom, Bert, and William","Duskwatch Hunter","Large Bear"],themeSearches:[{label:"Power 4+",url:"https://scryfall.com/search?q=set%3Ahob+power%3E%3D4&unique=cards&as=grid&order=name"}],sourceText:"Draftsim",sourceUrl:"https://draftsim.com/mtg-hob-draft-archetypes/",mechanic:"ferocious",mechanicDef:"Ferocious \u2014 a returning ability word checking whether you control a creature with power 4 or greater."},RW:{text:"Storied",sub:"Dwarves\nEquipment",details:"Storied is the set's headline mechanic and works like Ascend: once you control three or more artifacts, legendaries and/or Sagas, you have an enduring story for the rest of the game and it cannot be taken away. Legendary Dwarves, Equipment with hone counters, and the set's seven Sagas all count.\nCards: Thorin Oakenshield; Bifur, Melodic Rider; Dwalin, Weaponmaster; Balin, Loremaster.",cards:["Thorin Oakenshield","Bifur, Melodic Rider","Dwalin, Weaponmaster","Balin, Loremaster"],themeSearches:[{label:"Dwarves",url:"https://scryfall.com/search?q=set%3Ahob+t%3Adwarf&unique=cards&as=grid&order=name"}],sourceText:"Draftsim",sourceUrl:"https://draftsim.com/mtg-hob-draft-archetypes/",sourceText2:"WotC Mechanics",sourceUrl2:"https://magic.wizards.com/en/news/feature/the-hobbit-mechanics",mechanic:"storied",mechanicDef:"Storied \u2014 \"If you control three or more artifacts, legendaries, and/or Sagas, you have an enduring story for the rest of the game.\""},GU:{text:"Landfall",sub:"Elves\nRamp",details:"Every land drop matters. Elves ramp and fix while landfall triggers accumulate; Thranduil's Adventure half rallies the Elves before the creature ever hits the battlefield.\nCards: Silvan Reveler; Thranduil, Sindarin Liege; Thranduil's Company; Mirkwood Nurturer.",cards:["Silvan Reveler","Thranduil, Sindarin Liege","Thranduil's Company","Mirkwood Nurturer"],themeSearches:[{label:"Elves",url:"https://scryfall.com/search?q=set%3Ahob+t%3Aelf&unique=cards&as=grid&order=name"}],sourceText:"Draftsim",sourceUrl:"https://draftsim.com/mtg-hob-draft-archetypes/",mechanic:"landfall",mechanicDef:"Landfall \u2014 a returning ability word triggering whenever a land enters the battlefield under your control."}},resourceLinks:[{label:"The Hobbit Prerelease Guide",url:"https://magic.wizards.com/en/news/feature/the-hobbit-prerelease-guide",desc:"Official Wizards of the Coast archetype guide - confirms five two-color archetypes and their signpost uncommons",official:true},{label:"The Hobbit Mechanics",url:"https://magic.wizards.com/en/news/feature/the-hobbit-mechanics",desc:"Official Wizards of the Coast mechanics breakdown (storied, recruit, hone counters, amass, Adventure)",official:false},{label:"The Hobbit Release Notes",url:"https://magic.wizards.com/en/news/feature/the-hobbit-release-notes",desc:"Official Wizards of the Coast release notes - card-specific rulings and interaction clarifications",official:false},{label:"Exploring All Five of The Hobbit's Limited Archetypes",url:"https://draftsim.com/mtg-hob-draft-archetypes/",desc:"Draftsim's archetype-by-archetype breakdown with signpost uncommons"},{label:"MTG Prerelease Guide: The Hobbit",url:"https://cardgamebase.com/mtg-prerelease-guide-the-hobbit/",desc:"Card Game Base prerelease tips and archetype overview"},{label:"The Hobbit on Scryfall",url:"https://scryfall.com/sets/hob",desc:"Full card gallery and search - the data source behind this page"},{label:"The Hobbit - MTG Wiki",url:"https://mtg.fandom.com/wiki/The_Hobbit",desc:"Set facts: release dates, product configuration, set size"}],setMechanics:[{name:"Hone counters",keyword:"hone",description:"New. Reminder text: \"Each hone counter on an Equipment grants +1/+0 to equipped creature.\" This is a property of the counter itself, not an ability granted to the Equipment, so it works no matter how the counter arrives. Rewards long games and Equipment decks.",cards:["Sting, Bilbo's Sword","Dwalin, Weaponmaster"],source:"WotC Mechanics",sourceUrl:"https://magic.wizards.com/en/news/feature/the-hobbit-mechanics",scryfallQuery:"https://scryfall.com/search?q=set%3Ahob+o%3Ahone&unique=cards&as=grid&order=rarity",scryfallLabel:"o:hone"},{name:"Adventure",keyword:"adventure",description:"Returning with no rules changes. The card has two castable halves: an instant or sorcery Adventure, which exiles on resolution, and a permanent you may then cast from exile. 17 Adventure cards in the set - a strong signal for two-for-one value across all five archetypes.",source:"WotC Mechanics",sourceUrl:"https://magic.wizards.com/en/news/feature/the-hobbit-mechanics",scryfallQuery:"https://scryfall.com/search?q=set%3Ahob+is%3Aadventure&unique=cards&as=grid&order=rarity",scryfallLabel:"is:adventure"},{name:"Sagas",description:"Eight Sagas in the set. Sagas are one of the three permanent types that turn on storied, alongside artifacts and legendaries.",source:"Scryfall set data (complete set, checked 2026-11-06)",sourceUrl:"https://scryfall.com/sets/hob",scryfallQuery:"https://scryfall.com/search?q=set%3Ahob+t%3Asaga&unique=cards&as=grid&order=rarity",scryfallLabel:"t:saga"}]},FRA:{key:"FRA",name:"Reality Fracture",shortName:"FRA",releaseDate:"October 2, 2026",version:"1.0.0",scryfallCodes:["fra"],primaryArchetypes:["WU","UB","BR","RG","GW"],primaryLabel:"5 Hexhaven school archetypes (allied pairs) + 5 planeswalker archetypes (enemy pairs)",primaryDescription:"Reality Fracture supports all ten color pairs, but not equally. The five allied pairs are the Hexhaven schools, each with nine dedicated cards: an elder sphinx mythic, a gold rare, a gold uncommon, a Charm, three prepared creatures that all cast the same school spell, a reprinted slow land and a common Annex dual.",secondaryLabel:"Planeswalker Archetypes (enemy pairs)",secondaryDescription:"The five enemy pairs are themed on the Lorwyn Five - Ajani, Jace, Liliana, Chandra and Garruk - and their Echoverse counterparts. Real archetypes, but three to five cards deep against the schools' nine.",accentColor:"#0E7490",colorDescriptions:{W:{name:"White",description:"Core theme: +1/+1 counters. It is the foundation of two pairs - Vigorbloom (GW, life gain) and Ajani's Army (RW, aggro).\nCards:\n\u2022 Hexhaven Battalion\n\u2022 Ajani Resolute\n\u2022 Liliana the Faultless\n\u2022 Way of the Healer\n\u2022 Way of the Mentor",cards:["Hexhaven Ba Mechanics:[{name:"Spacecraft and Station",keyword:"station",quote:"The station mechanic is back to help you get your Spacecraft up and running; once they've got the right amount of charge counters, they'll be ready to use all their abilities. In most cases, this will also turn them into creatures ready to attack and block.",quoteSource:"Star Trek Release Notes",quoteUrl:"https://magic.wizards.com/en/news/feature/star-trek-release-notes",description:"In TRK: 17 Spacecraft, every one with station, in every color - W 3, U 4, B 1, R 2, G 2, WB 1 (Borg Cube), colorless 4. Reminder text from Oberth-Class Starship, a common.",reminder:"Station (Tap another creature you control: Put charge counters equal to its power on this Spacecraft. Station only as a sorcery. It's an artifact creature at 6+.)",cards:["Oberth-Class Starship","Borg Cube"],source:"WotC Release Notes",sourceUrl:"https://magic.wizards.com/en/news/feature/star-trek-release-notes",scryfallQuery:"https://scryfall.com/search?q=set%3Atrk+keyword%3Astation&unique=cards&as=grid&order=rarity",scryfallLabel:"keyword:station"},{name:"Beam me up",keyword:"beam me up",quote:"Some instant and sorcery cards in this release have the beam me up keyword ability, which allows you to cast them from your graveyard by paying a cost and returning a creature you control to its owner's hand.",quoteSource:"Star Trek Release Notes",quoteUrl:"https://magic.wizards.com/en/news/feature/star-trek-release-notes",description:"In TRK: 11 cards in every color - 10 sorceries (W 3, U 2, B 1, R 2, G 2, five of them common) and the blue mythic Scotty, Miracle Worker, who gives beam me up to every instant and sorcery in your graveyard during your main phase. Reminder text from Open Communications, a common.",reminder:"Beam me up {2}{U} (You may cast this card from your graveyard for {2}{U} if you also return a creature you control to its owner's hand. Then exile this spell.)",cards:["Open Communications","Scotty, Miracle Worker"],source:"WotC Rel
