  <!-- GoatCounter PATTERN A: count the #hash so each set view (#hob, #msh, …) is its own dashboard path.
       The public count.js snippet is auto-injected at push time, just before the closing head tag; this
       inline config must run first, and does. NOTE: do NOT write the closing-head string literally in this
       comment — the injector inserts before the FIRST such string and would bury count.js inside the comment.
       See mtg/SHARED_HEADER_FOOTER.md "Analytics — GoatCounter". -->
  <script>
    window.goatcounter = {
      path: function () { return location.pathname + location.search + location.hash; }
    };
    addEventListener('hashchange', function () {
      if (window.goatcounter && window.goatcounter.count)
        window.goatcounter.count({ path: location.pathname + location.search + location.hash });
    });
  </script>

  <!--
    Offline / CDN guard. Everything below is rendered by the type="text/babel" block, which
    needs React, ReactDOM and Babel from unpkg. With no network those never load, Babel never
    compiles the JSX, and #root stays empty - a silent white page. This turns that into a
    readable message. Plain <script> on purpose: it must run when Babel is exactly what failed.
  -->
  <script>
    (function () {
      var firstError = null;
      window.addEventListener('error', function (e) {
        if (!firstError && e && e.message) firstError = e.message;
      }, true);

      function missingLibs() {
        var missing = [];
        if (!window.React) missing.push('React');
        if (!window.ReactDOM) missing.push('ReactDOM');
        if (!window.Babel) missing.push('Babel');
        return missing;
      }

      function el(tag, css, text) {
        var node = document.createElement(tag);
        if (css) node.setAttribute('style', css);
        if (text) node.textContent = text;
        return node;
      }

      function showFailure() {
        var root = document.getElementById('root');
        if (!root || root.childElementCount > 0) return;  // rendered fine, nothing to do

        var missing = missingLibs();
        var box = el('div', 'max-width:620px;margin:80px auto;padding:32px 24px;text-align:center;' +
                            'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
                            'background:#fff;border:1px solid #e2e2e2;border-radius:10px;');

        if (missing.length) {
          box.appendChild(el('div', 'font-size:40px;line-height:1;margin-bottom:16px;', '📡'));
          box.appendChild(el('h1', 'font-size:21px;color:#1a1a1a;margin-bottom:12px;font-weight:600;',
            'This page needs an internet connection'));
          box.appendChild(el('p', 'font-size:15px;color:#555;line-height:1.6;',
            'The color wheel is drawn in your browser by React, which loads from a CDN along with ' +
            'Babel. Those files could not be fetched, so there is nothing to draw.'));
          box.appendChild(el('p', 'font-size:13px;color:#888;line-height:1.6;margin-top:14px;',
            'Did not load: ' + missing.join(', ')));
        } else {
          box.appendChild(el('div', 'font-size:40px;line-height:1;margin-bottom:16px;', '⚠️'));
          box.appendChild(el('h1', 'font-size:21px;color:#1a1a1a;margin-bottom:12px;font-weight:600;',
            'Something went wrong rendering this page'));
          box.appendChild(el('p', 'font-size:15px;color:#555;line-height:1.6;',
            'The libraries loaded, but the page failed to draw. This is a bug, not a connection ' +
            'problem - the browser console has the details.'));
          if (firstError) {
            box.appendChild(el('p', 'font-size:12px;color:#888;margin-top:14px;text-align:left;' +
                                    'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;' +
                                    'background:#f7f7f7;border-radius:6px;padding:10px 12px;' +
                                    'word-break:break-word;', firstError));
          }
        }

        var retry = el('button', 'margin-top:22px;padding:9px 20px;font-size:14px;color:#fff;' +
                                 'background:#4a5568;border:0;border-radius:6px;cursor:pointer;', 'Reload');
        retry.onclick = function () { location.reload(); };
        box.appendChild(retry);

        root.appendChild(box);
      }

      // window.load fires after Babel's DOMContentLoaded transform pass; the timeout leaves
      // room for the first React render before we call it a failure.
      window.addEventListener('load', function () { setTimeout(showFailure, 500); });
    })();
  </script>

      BG: { text: "Ooze", sub: "Disappear", details: "Disappear triggers when your permanents leave the battlefield, generating value through sacrifice and removal. Michelangelo's chaos and the ooze subtype create recursive value loops. Great at grinding out opponents.", sourceText: "WotC / Draftsim / GameDaily", sourceUrl: "https://draftsim.com/mtg-tmt-limited-set-review/" },

      GU: { text: "Quandrix", sub: "Increment\nValue", details: "The increment mechanic adds +1/+1 counters when you cast spells with greater mana value than a creature's power or toughness. Deploy Cuboid Colony early, then grow it with massive spells. Look for evasion like Emil, Vastlands Roamer to push damage through.", sourceText: "WotC Prerelease Guide", sourceUrl: "https://magic.wizards.com/en/news/feature/secrets-of-strixhaven-prerelease-guide", mechanic: "increment", mechanicDef: "Increment — When you cast a spell, if the mana spent exceeds this creature's power or toughness, put a +1/+1 counter on it." },

const SET_ORDER = ['ECL', 'FDN', 'TMT', 'SOS', 'MSH', 'HOB'];

// ─── CONSTANTS ────────────────────────────────────────────────────────────────

const baseHex = {
  W: "#FFFFFF",
  U: "#3366FF",
  B: "#000000",
  R: "#FF3333",
  G: "#2ECC40",
};

const manaClasses = {
  W: 'ms ms-w',
  U: 'ms ms-u',
  B: 'ms ms-b',
  R: 'ms ms-r',
  G: 'ms ms-g',
};

const colorOrder = ['W', 'U', 'B', 'R', 'G'];

// ─── HELPERS ──────────────────────────────────────────────────────────────────

const isMobile = () => window.innerWidth <= 768;

const getConfig = (textSizeMultiplier = 1.0) => {
  const mobile = isMobile();
  const baseFontSize = mobile ? 10 : 11;
  return {
    width: 700,
    height: 700,
    cx: 350,
    cy: 330,
    radius: mobile ? 140 : 180,
    nodeRadius: mobile ? 24 : 30,
    edgeWidth: mobile ? 4 : 5,
    boxW: mobile ? 58 : 62,
    boxH: mobile ? 32 : 36,
    primaryBoxW: mobile ? 68 : 72,
    primaryBoxH: mobile ? 40 : 44,
    fontSize: Math.round(baseFontSize * textSizeMultiplier),
    lineSpacing: mobile ? 9 : 10,
    iterMax: 240,
    pushStep: 6,
  };
};

const hexToRgb = (h) => {
  const hex = h.replace('#', '');
  return [parseInt(hex.substring(0,2),16), parseInt(hex.substring(2,4),16), parseInt(hex.substring(4,6),16)];
};

const rgbToHex = (r, g, b) =>
  '#' + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join('');

const darken = (h, amt = 0.4) => {
  const [r, g, b] = hexToRgb(h);
  return rgbToHex(r*(1-amt), g*(1-amt), b*(1-amt));
};

const blend = (u, v) => {
  const [r1,g1,b1] = hexToRgb(baseHex[u]);
  const [r2,g2,b2] = hexToRgb(baseHex[v]);
  return rgbToHex((r1+r2)/2, (g1+g2)/2, (b1+b2)/2);
};

const relLum = (h) => {
  const [r,g,b] = hexToRgb(h).map(x => x/255);
  const f = (c) => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
};

const contrastRatio = (bg, fg) => {
  const [L1,L2] = [relLum(bg), relLum(fg)].sort((a,b) => b-a);
  return (L1+0.05)/(L2+0.05);
};

const getLabelColors = (u, v) => {
  let bg, fg;
  if (u === 'B' || v === 'B') {
    bg = '#000000';
    const partner = u === 'B' ? v : u;
    fg = partner === 'W' ? '#FFFFFF' : baseHex[partner];
  } else if (u === 'W' || v === 'W') {
    const partner = u === 'W' ? v : u;
    bg = darken(baseHex[partner], 0.4);
    fg = '#FFFFFF';
  } else {
    bg = darken(baseHex[u], 0.4);
    fg = baseHex[v];
    if (contrastRatio(bg, fg) < 4.5) {
      const [r,g,b] = hexToRgb(fg);
      fg = rgbToHex(Math.min(r+140,255), Math.min(g+140,255), Math.min(b+140,255));
    }
  }
  return { bg, fg };
};

const getEdgeList = (labels) => Object.keys(labels).map(pair => ({
  u: pair[0], v: pair[1],
  uIdx: colorOrder.indexOf(pair[0]),
  vIdx: colorOrder.indexOf(pair[1]),
}));

const getNodePos = (index, config) => {
  const angle = (index * 72 - 90) * (Math.PI / 180);
  return { x: config.cx + config.radius * Math.cos(angle), y: config.cy + config.radius * Math.sin(angle) };
};

const getNodePositions = (config) => colorOrder.map((_,i) => getNodePos(i, config));

const getEdgeGeometry = (uIdx, vIdx, config) => {
  const np = getNodePositions(config);
  const p1 = np[uIdx], p2 = np[vIdx];
  const dx = p2.x-p1.x, dy = p2.y-p1.y;
  const L = Math.hypot(dx, dy);
  const ux = dx/L, uy = dy/L;
  const x = (p1.x + ux*config.nodeRadius + p2.x - ux*config.nodeRadius)/2;
  const y = (p1.y + uy*config.nodeRadius + p2.y - uy*config.nodeRadius)/2;
  return { x, y, tx: ux, ty: uy, nx: -uy, ny: ux };
};

const getBbox = (cx, cy, isPrimary, config, hOverride) => {
  const w = isPrimary ? config.primaryBoxW : config.boxW;
  const h = hOverride != null ? hOverride : (isPrimary ? config.primaryBoxH : config.boxH);
  return { x1: cx-w/2, x2: cx+w/2, y1: cy-h/2, y2: cy+h/2 };
};

// True rendered box height for a label, mirroring LabelBox's totalTextHeight (so the
// de-overlap solver knows when a wrapped title makes a box taller). Never smaller than config.
const getLabelBoxHeight = (labelData, isPrimary, config) => {
  const lh = config.fontSize * 1.1;
  const titleLines = (labelData && labelData.text ? labelData.text : '').split('\n');
  const subLines = labelData && labelData.sub ? labelData.sub.split('\n') : [];
  const textH = lh /*code*/ + lh /*title line 1*/ + (titleLines.length - 1) * lh
    + (subLines.length > 0 ? lh + (subLines.length - 1) * 7 : 0);
  return Math.max(textH + 6, isPrimary ? config.primaryBoxH : config.boxH);
};

const isOverlap = (b1, b2, margin = 2) =>
  !(b1.x2+margin < b2.x1 || b2.x2+margin < b1.x1 || b1.y2+margin < b2.y1 || b2.y2+margin < b1.y1);

const computeLabelPositions = (config, labels, primaryArchetypes) => {
  const edges = getEdgeList(labels);
  const groups = edges.map(edge => {
    const pairCode = edge.u + edge.v;
    const isPrimary = primaryArchetypes.includes(pairCode);
    const labelData = labels[pairCode] || labels[edge.v + edge.u];
    const boxH = getLabelBoxHeight(labelData, isPrimary, config);
    const { x, y, tx, ty, nx, ny } = getEdgeGeometry(edge.uIdx, edge.vIdx, config);
    const sgn = (x - config.cx)*nx + (y - config.cy)*ny > 0 ? 1 : -1;
    const off = sgn * (isPrimary ? 20 : 15);
    const tshift = edge.u < edge.v ? 3 : -3;
    const cx = x + nx*off + tx*tshift;
    const cy = y + ny*off + ty*tshift;
    return { ...edge, cx, cy, isPrimary, boxH, bbox: getBbox(cx, cy, isPrimary, config, boxH) };
  });
  for (let iter = 0; iter < config.iterMax; iter++) {
    let moved = false;
    for (let i = 0; i < groups.length; i++) {
      for (let j = i+1; j < groups.length; j++) {
        if (isOverlap(groups[i].bbox, groups[j].bbox)) {
          const dx = groups[i].cx - groups[j].cx;
          const dy = groups[i].cy - groups[j].cy;
          const L = Math.hypot(dx, dy) + 0.001;
          groups[i].cx += (dx/L)*config.pushStep;
          groups[i].cy += (dy/L)*config.pushStep;
          groups[j].cx -= (dx/L)*config.pushStep;
          groups[j].cy -= (dy/L)*config.pushStep;
          groups[i].bbox = getBbox(groups[i].cx, groups[i].cy, groups[i].isPrimary, config, groups[i].boxH);
          groups[j].bbox = getBbox(groups[j].cx, groups[j].cy, groups[j].isPrimary, config, groups[j].boxH);
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  return groups;
};

// ─── COMPONENTS ───────────────────────────────────────────────────────────────

const ManaSymbol = ({ color, size = 24, isSimple = false }) => (
  <i
    className={manaClasses[color]}
    style={{
      fontSize: `${size}px`,
      color: isSimple ? '#000000' : (color === 'W' ? '#000000' : '#FFFFFF'),
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}
  />
);

const ColorNode = ({ color, index, isHighlighted, isDimmed, onHover, onLeave, isSimple, config }) => {
  const pos = getNodePositions(config)[index];
  return (
    <g onMouseEnter={onHover} onMouseLeave={onLeave}
       style={{ cursor: 'pointer', transition: 'opacity 0.2s ease' }}
       opacity={isDimmed ? 0.3 : 1}>
      <circle cx={pos.x} cy={pos.y} r={config.nodeRadius + (isHighlighted ? 12 : 8)}
        fill={isHighlighted ? "#FFD700" : (isSimple ? 'transparent' : baseHex[color])}
        opacity={isHighlighted ? 0.6 : 0.25} style={{ transition: 'all 0.2s ease' }} />
      <circle cx={pos.x} cy={pos.y} r={config.nodeRadius}
        fill={isSimple ? '#FFFFFF' : baseHex[color]}
        stroke={isHighlighted ? "#FFD700" : "#000000"}
        strokeWidth={isHighlighted ? 4 : 3} style={{ transition: 'all 0.2s ease' }} />
      <foreignObject x={pos.x-20} y={pos.y-20} width={40} height={40}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '40px', height: '40px',
          color: isSimple ? '#000000' : (color === 'W' ? '#000000' : '#FFFFFF') }}>
          <ManaSymbol color={color} size={30} isSimple={isSimple} />
        </div>
      </foreignObject>
    </g>
  );
};

const EdgeLine = ({ edge, isHighlighted, isDimmed, isPrimary, isSimple, config }) => {
  const np = getNodePositions(config);
  const p1 = np[edge.uIdx], p2 = np[edge.vIdx];
  const lineOpacity = isDimmed ? 0.1 : (isPrimary ? 1 : 0.45);
  return (
    <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}
      stroke={isHighlighted ? "#FFD700" : (isSimple ? '#000000' : blend(edge.u, edge.v))}
      strokeWidth={isHighlighted ? config.edgeWidth+3 : (isPrimary ? config.edgeWidth+2 : config.edgeWidth)}
      opacity={lineOpacity} style={{ transition: 'all 0.2s ease' }} />
  );
};

const LabelBox = ({ group, isHighlighted, isDimmed, onHover, onLeave, onClick, isSimple, config, labels, primaryArchetypes }) => {
  const groupRef = useRef(null);
  const [boxSize, setBoxSize] = useState({ width: 50, height: 35 });
  const code = group.u + group.v;
  const labelData = labels[code] || labels[group.v + group.u];
  if (!labelData) return null;
  const { bg, fg } = getLabelColors(group.u, group.v);
  const subLines = labelData.sub ? labelData.sub.split('\n') : [];
  const boxBg = isSimple ? '#FFFFFF' : bg;
  const boxStroke = isSimple ? '#000000' : blend(group.u, group.v);
  const textColor = isSimple ? '#000000' : fg;
  const isPrimary = primaryArchetypes.includes(code);

  const titleLines = (labelData.text || '').split('\n');
  const lh = config.fontSize * 1.1;
  const titleExtra = (titleLines.length - 1) * lh; // extra height per wrapped title line
  const totalTextHeight = lh /*code*/ + lh /*title line 1*/ + titleExtra + (subLines.length > 0 ? lh + (subLines.length - 1) * 7 : 0);
  const startY = group.cy - totalTextHeight / 2;
  const y1 = startY + lh * 0.8, y2 = y1 + lh, y3 = y2 + titleExtra + lh * 0.9;

  useEffect(() => {
    if (groupRef.current) {
      const texts = groupRef.current.querySelectorAll('text');
      let maxWidth = 0;
      texts.forEach(t => { try { maxWidth = Math.max(maxWidth, t.getBBox().width); } catch(e){} });
      setBoxSize({ width: Math.max(maxWidth + 8, 35), height: totalTextHeight + 6 });
    }
  }, [code, labelData.text, labelData.sub, config.fontSize, totalTextHeight]);

  // Unsupported pairs (HOB's five off-archetype pairs) render nothing at all, rather
  // than the small "code only" blank box other sets' off-pairs get. Placed after every
  // hook above (not as an early return before them) so hook order stays identical across
  // renders of this same keyed instance when the user switches sets — a set with no
  // unsupported pairs must still call the exact same hooks in the exact same order.
  if (labelData.unsupported) return null;

  return (
    <g ref={groupRef} onMouseEnter={onHover} onMouseLeave={onLeave} onClick={onClick}
       style={{ cursor: 'pointer', transition: 'all 0.2s ease' }}
       opacity={isDimmed ? 0.15 : (isPrimary ? 1 : 0.5)}
       transform={isHighlighted ? `translate(${group.cx},${group.cy}) scale(1.08) translate(${-group.cx},${-group.cy})` : undefined}>
      <rect x={group.cx-boxSize.width/2} y={group.cy-boxSize.height/2}
        width={boxSize.width} height={boxSize.height} rx={4}
        fill={boxBg} stroke={isHighlighted ? "#FFD700" : boxStroke}
        strokeWidth={isHighlighted ? 3 : (isPrimary ? 2 : 1.5)}
        style={{ transition: 'all 0.2s ease' }} />
      <text x={group.cx} y={y1} textAnchor="middle" fontSize={config.fontSize} fontWeight="bold" fill={textColor}>{code}</text>
      <text x={group.cx} y={y2} textAnchor="middle" fontSize={config.fontSize} fontWeight={isPrimary ? "bold" : "normal"} fill={textColor}>
        {titleLines.map((line, i) => <tspan key={i} x={group.cx} dy={i === 0 ? 0 : lh}>{line}</tspan>)}
      </text>
      {subLines.length > 0 && (
        <text x={group.cx} y={y3} textAnchor="middle" fontSize={config.fontSize} fill={textColor} opacity={0.85}>
          {subLines.map((line, i) => <tspan key={i} x={group.cx} dy={i === 0 ? 0 : 7}>{line}</tspan>)}
        </text>
      )}
    </g>
  );
};

// Card preview images are resolved via the Scryfall JSON API (cached by
// name+set) and rendered from the CDN url in the response - see
// docs/SCRYFALL_IMAGE_LOADING.md for why a direct API image-redirect hotlink
// is never used here.
const cardLinkImageCache = new Map();
const CARD_PREVIEW_W = 300;
const CARD_PREVIEW_H = Math.round(CARD_PREVIEW_W * 680 / 488); // Scryfall "normal" card image aspect ratio

const CardLink = ({ cardName, setCode, fg }) => {
  const [hovered, setHovered] = useState(false);
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const [imgSrc, setImgSrc] = useState(null);
  const frontName = cardName.split(' // ')[0];
  const scryfallUrl = `https://scryfall.com/search?q=set%3A${setCode}+%22${encodeURIComponent(frontName)}%22`;

  const loadImage = () => {
    const cacheKey = `${frontName}|${setCode}`;
    if (cardLinkImageCache.has(cacheKey)) {
      setImgSrc(cardLinkImageCache.get(cacheKey));
      return;
    }
    fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(frontName)}&set=${setCode}`)
      .then(r => r.ok ? r.json() : fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(frontName)}`).then(r2 => r2.ok ? r2.json() : null))
      .then(card => {
        const url = card && (card.image_uris?.normal || card.card_faces?.[0]?.image_uris?.normal);
        if (url) {
          cardLinkImageCache.set(cacheKey, url);
          setImgSrc(url);
        }
      })
      .catch(() => {});
  };

  return (
    <span style={{ display: 'inline' }}>
      <a href={scryfallUrl} target="_blank" rel="noopener noreferrer"
         style={{ color: fg, textDecoration: 'underline' }}
         onMouseEnter={e => { setHovered(true); setPos({ x: e.clientX, y: e.clientY }); loadImage(); }}
         onMouseMove={e => setPos({ x: e.clientX, y: e.clientY })}
         onMouseLeave={() => setHovered(false)}>
        {cardName}
      </a>
      {hovered && imgSrc && (() => {
        // Flip to the opposite side of the cursor whenever the default (down-right)
        // placement would run the 300px-wide preview off the viewport edge.
        const margin = 14, w = CARD_PREVIEW_W, h = CARD_PREVIEW_H;
        let left = pos.x + margin, top = pos.y + margin;
        if (left + w > window.innerWidth) left = pos.x - margin - w;
        if (top + h > window.innerHeight) top = pos.y - margin - h;
        left = Math.max(4, left);
        top = Math.max(4, top);
        return ReactDOM.createPortal(
          <span style={{ position: 'fixed', top, left, zIndex: 99999, pointerEvents: 'none' }}>
            <img src={imgSrc} alt={cardName} style={{ width: CARD_PREVIEW_W + 'px', borderRadius: '14px', boxShadow: '0 4px 12px rgba(0,0,0,0.6)', display: 'block' }} />
          </span>,
          document.body
        );
      })()}
    </span>
  );
};

// Wrap any known card names found in `text` with hover-image CardLinks (matches longest names first)
// Also handles bold formatting for "Cards:", "Top commons:", "Top uncommons:", and "Top Rares and mythics:" markers
// Converts \n to <br /> for proper line break rendering
const linkifyCards = (text, cards, setCode, fg) => {
  if (!text || !cards || cards.length === 0) return text;

  // Split by newlines to handle bold labels on their own line
  const lines = text.split('\n');
  const boldLabels = ['Cards:', 'Top commons:', 'Top uncommons:', 'Top Rares and mythics:'];
  const processedLines = lines.map(line => {
    const trimmed = line.trim();
    if (boldLabels.includes(trimmed)) {
      return { __bold: true, __text: trimmed };
    }
    return line;
  });

  const sorted = [...cards].sort((a, b) => b.length - a.length);
  let segs = [];

  processedLines.forEach((lineItem, lineIdx) => {
    if (typeof lineItem === 'object' && lineItem.__bold) {
      segs.push(lineItem);
      if (lineIdx < processedLines.length - 1) segs.push({ __br: true });
      return;
    }

    let lineSeg = [lineItem];
    sorted.forEach(card => {
      const out = [];
      lineSeg.forEach(seg => {
        if (typeof seg !== 'string') { out.push(seg); return; }
        const parts = seg.split(card);
        parts.forEach((part, i) => {
          if (part) out.push(part);
          if (i < parts.length - 1) out.push({ __card: card });
        });
      });
      lineSeg = out;
    });

    segs.push(...lineSeg);
    if (lineIdx < processedLines.length - 1) segs.push({ __br: true });
  });

  return segs.map((s, i) => {
    if (typeof s === 'string') {
      return <React.Fragment key={i}>{s}</React.Fragment>;
    } else if (s.__bold) {
      return <b key={i}>{s.__text}</b>;
    } else if (s.__br) {
      return <br key={i} />;
    } else {
      return <CardLink key={i} cardName={s.__card} setCode={setCode} fg={fg} />;
    }
  });
};

// Renders "Source: X" as a link, or "Source: X Y" as two separate links (space-separated)
// when a label carries a second source (sourceText2/sourceUrl2) — e.g. HOB's archetypes
// citing both Draftsim and the WotC mechanics article.
const SourceLine = ({ data, fg }) => {
  if (!data.sourceText) return null;
  const sources = [{ text: data.sourceText, url: data.sourceUrl }];
  if (data.sourceText2) sources.push({ text: data.sourceText2, url: data.sourceUrl2 });
  return (
    <>
      Source:{' '}
      {sources.map((s, i) => (
        <React.Fragment key={i}>
          {i > 0 && ' '}
          {s.url && s.url !== '#'
            ? <a href={s.url} target="_blank" rel="noopener noreferrer" style={{ color: fg, textDecoration: 'underline' }}>{s.text}</a>
            : <span>{s.text}</span>}
        </React.Fragment>
      ))}
    </>
  );
};

const WEDGE_COLORS = { Jeskai: 'W\u222AU\u222AR', Sultai: 'U\u222AB\u222AG', Mardu: 'B\u222AR\u222AW', Temur: 'R\u222AG\u222AU', Abzan: 'G\u222AW\u222AB' };

// The one and only Scryfall button row for a colour pair: a "Scryfall:" caption then one
// button per search, each labelled with the query itself.
//
// This used to be four hand-copied blocks (InfoPanel, the all-10 grid, the primary-archetype
// grid, the off-arch grid), which is exactly how HOB's themeSearches ended up visible in the
// diagram popup but missing from the boxes: the block was added to two copies and not the
// other two. Adding a new kind of search now means adding it here, once.
//
// `large` = the floating popup's roomier buttons (easier to tap); grids use the compact size.
const ScryfallRow = ({ data, pair, sc, bg, fg, large, center }) => {
  const btns = [];
  // Off-arch wedge boxes deliberately drop the exact-identity search: for a pair with no
  // archetype, "cards that are exactly these two colours" is a near-empty result.
  if (!data.wedge) {
    btns.push({ label: `${pair[0]}&${pair[1]}`, url: `https://scryfall.com/search?q=set%3A${sc}+id%3D${pair}` });
  }
  btns.push({ label: `${pair[0]}\u222A${pair[1]}`, url: `https://scryfall.com/search?q=set%3A${sc}+(id%3D${pair[0]}+or+id%3D${pair[1]}+or+id%3D${pair})` });
  if (data.mechanic) {
    btns.push({ label: `o:${data.mechanic}`, url: `https://scryfall.com/search?q=set%3A${sc}+o%3A${data.mechanic}` });
  }
  if (data.wedge) {
    btns.push({ label: `${data.wedge} (${WEDGE_COLORS[data.wedge]})`, url: `https://scryfall.com/search?q=set%3A${sc}+id%3C${data.wedge}` });
  }
  if (data.themeSearches) btns.push(...data.themeSearches);

  const btnStyle = large
    ? { padding: '6px 14px', borderRadius: '4px', fontSize: '0.75rem', opacity: 0.8 }
    : { padding: '4px 10px', borderRadius: '3px', fontSize: '0.65rem' };

  return (
    <>
      <div style={{ fontSize: '0.65rem', opacity: 0.85, marginBottom: '5px', fontWeight: '600',
        textAlign: center ? 'center' : 'left' }}>Scryfall:</div>
      <div style={{ display: 'flex', gap: large ? '6px' : '4px', flexWrap: 'wrap',
        justifyContent: center ? 'center' : 'flex-start' }}>
        {btns.map((b, i) => (
          <a key={i} href={b.url} target="_blank" rel="noopener noreferrer"
             style={{ display: 'inline-block', backgroundColor: fg, color: bg,
               textDecoration: 'none', fontWeight: '600', ...btnStyle }}>
            {b.label}
          </a>
        ))}
      </div>
    </>
  );
};

function MultiSetColorWheel() {
  const [currentSetKey, setCurrentSetKey] = useState(() => {
    const hash = window.location.hash.slice(1).toUpperCase();
    // No (or unknown) #code -> default to the last set in SET_ORDER (newest addition)
    return SET_ORDER.includes(hash) ? hash : SET_ORDER[SET_ORDER.length - 1];
  });
  const [hoveredNode, setHoveredNode] = useState(null);
  const [hoveredPair, setHoveredPair] = useState(null);
  const [hoveredColor, setHoveredColor] = useState(null);
  const [isSimple, setIsSimple] = useState(false);
  const [textSize, setTextSize] = useState(1.0);
  const [config, setConfig] = useState(() => getConfig(1.0));
  const pairTimeoutRef = useRef(null);
  const colorTimeoutRef = useRef(null);

  const currentSet = SET_DATA[currentSetKey];

  useEffect(() => {
    const handleResize = () => setConfig(getConfig(textSize));
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, [textSize]);

  useEffect(() => { setConfig(getConfig(textSize)); }, [textSize]);

  // Sync URL hash with current set (write direction).
  // Assigning to location.hash pushes a history entry, which is what makes
  // Back/Forward able to step between sets - see the read direction below.
  useEffect(() => {
    window.location.hash = currentSetKey.toLowerCase();
  }, [currentSetKey]);

  // Read direction: the hash was previously read ONCE, in the useState
  // initializer, so anything that changed it after mount (Back/Forward, editing
  // the URL, an in-page anchor) moved the URL without moving the view. Listen for
  // hashchange and pull it back into state. Setting the same key is a no-op in
  // React, so this cannot loop against the write effect above.
  useEffect(() => {
    const onHashChange = () => {
      const hash = window.location.hash.slice(1).toUpperCase();
      if (SET_ORDER.includes(hash)) setCurrentSetKey(hash);
    };
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  // Reset hover state when set changes
  useEffect(() => {
    setHoveredNode(null);
    setHoveredPair(null);
    setHoveredColor(null);
  }, [currentSetKey]);

  const labelPositions = computeLabelPositions(config, currentSet.labels, currentSet.primaryArchetypes);
  const edges = getEdgeList(currentSet.labels);

  const handlePairHover = (pairCode) => {
    if (pairTimeoutRef.current) { clearTimeout(pairTimeoutRef.current); pairTimeoutRef.current = null; }
    setHoveredPair(pairCode);
  };

  const handlePairLeave = () => {
    pairTimeoutRef.current = setTimeout(() => setHoveredPair(null), 800);
  };

  const handleColorHover = (color) => {
    if (colorTimeoutRef.current) { clearTimeout(colorTimeoutRef.current); colorTimeoutRef.current = null; }
    setHoveredColor(color);
  };

  const handleColorLeave = () => {
    colorTimeoutRef.current = setTimeout(() => setHoveredColor(null), 800);
  };

  useEffect(() => {
    return () => {
      if (pairTimeoutRef.current) clearTimeout(pairTimeoutRef.current);
      if (colorTimeoutRef.current) clearTimeout(colorTimeoutRef.current);
    };
  }, []);

  const activeColors = hoveredPair ? [hoveredPair[0], hoveredPair[1]] : (hoveredNode ? [hoveredNode] : []);
  const activePair = hoveredPair;

  const primaryPairs = Object.entries(currentSet.labels).filter(([pair]) => currentSet.primaryArchetypes.includes(pair));
  const secondaryPairs = Object.entries(currentSet.labels).filter(([pair]) => !currentSet.primaryArchetypes.includes(pair));

        <div className="header-content">
          <h1>MTG Draft Archetypes <span>Multi-Set Color Wheel &middot; v1.6.1 &middot; 2026-08-07 15:20 UTC</span></h1>
          <div className="data-info">
            <strong>Card names &amp; images:</strong> <a href="https://scryfall.com/docs/api" target="_blank" rel="noopener noreferrer">Scryfall API</a> <span className="sep">&middot;</span> <a href="https://www.patreon.com/scryfall" target="_blank" rel="noopener noreferrer">Support them on Patreon</a>

        display: 'flex', gap: '8px', alignItems: 'center', justifyContent: 'center',
        marginBottom: '20px', flexWrap: 'nowrap',
        backgroundColor: '#F3F4F6', padding: '6px', borderRadius: '12px',
      }}>
        {SET_ORDER.map(key => {
          const s = SET_DATA[key];
          const isActive = currentSetKey === key;
          const setSymbolClass = {
            ECL: 'ss ss-ecl',
            FDN: 'ss ss-fdn',
            TMT: 'ss ss-tmt',
          }[key];
          const scryfallIcon = {
            SOS: 'https://svgs.scryfall.io/sets/sos.svg',
            MSH: 'https://svgs.scryfall.io/sets/msh.svg',
            HOB: 'https://svgs.scryfall.io/sets/hob.svg',
          }[key];
          return (
            <button
              key={key}
              onClick={() => setCurrentSetKey(key)}
              style={{
                padding: '8px 16px',
                borderRadius: '8px',
                border: 'none',
                cursor: 'pointer',
                fontWeight: isActive ? '700' : '500',
                fontSize: '0.85rem',
                backgroundColor: isActive ? s.accentColor : 'transparent',
                color: isActive ? '#FFFFFF' : '#374151',
                transition: 'all 0.2s ease',
                whiteSpace: 'nowrap',
                display: 'flex',
                alignItems: 'center',
                gap: '6px',
              }}
            >
              {scryfallIcon
                ? <img src={scryfallIcon} alt={key} style={{ width: '1.2em', height: '1.2em', filter: isActive ? 'brightness(0) invert(1)' : 'brightness(0)' }} />
                : <i className={setSymbolClass} style={{ fontSize: '1.2em' }}></i>
              }
              {s.shortName}
            </button>
          );
        })}
      </div>

      {/* Link out to the custom wheel builder */}
      <div style={{ textAlign: 'center', marginBottom: '16px' }}>
        <a className="make-your-own" style={{ '--accent': currentSet.accentColor }}
           href="https://toskicologist.github.io/MTG-draft-sets-infographics/mtg/color-wheel-project/custom-color-wheel.html"
           target="_blank" rel="noopener noreferrer">
          Make your own!
        </a>
      </div>

      {/* Current Set Info */}
      <div style={{ textAlign: 'center', marginBottom: '16px' }}>
        <h2 style={{ fontSize: '1.4rem', fontWeight: '700', color: '#111827', margin: '0 0 4px 0' }}>
          {currentSet.name}
        </h2>
        <p style={{ fontSize: '0.8rem', color: '#9CA3AF', margin: '0 0 4px 0' }}>
          Set code: {currentSet.key} · Released: {currentSet.releaseDate} · Wheel v{currentSet.version}
        </p>
        <div style={{ display: 'inline-block', margin: '4px 0 8px', padding: '4px 12px', borderRadius: '999px',
          background: currentSet.accentColor, color: 'white', fontSize: '0.75rem', fontWeight: '600' }}>
          ★ {currentSet.primaryLabel}
        </div>
        <p style={{ fontSize: '0.85rem', color: '#9CA3AF', margin: '4px 0 0 0' }}>
          Mouse over archetypes for details · Scroll down: <a href="#colors" style={{ color: '#2563EB', textDecoration: 'underline' }}>Colors</a>
          {' | '}
          <a href="#archetypes" style={{ color: '#2563EB', textDecoration: 'underline' }}>Archetypes</a>
        </p>
      </div>

      {/* Official WotC link at top */}
      {(() => {
        const officialLink = currentSet.resourceLinks && currentSet.resourceLinks.find(l => l.official);
        return officialLink ? (
          <p style={{ fontSize: '0.8rem', color: '#9CA3AF', margin: '0 0 8px 0', textAlign: 'center' }}>
            New to this set? Go to <a href={officialLink.url} target="_blank" rel="noopener noreferrer" style={{ color: '#2563EB', textDecoration: 'underline' }}>{officialLink.label} (Wizards of the Coast)</a>
          </p>
        ) : null;
      })()}

      {/* Controls */}
      <div style={{ display: 'flex', gap: '24px', alignItems: 'center', justifyContent: 'center', marginBottom: '12px', flexWrap: 'wrap' }}>
        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer', fontSize: '0.9rem', fontWeight: '500', color: '#374151' }}>
          <input type="checkbox" checked={isSimple} onChange={e => setIsSimple(e.target.checked)} style={{ width: '16px', height: '16px', cursor: 'pointer' }} />
          B&amp;W
        </label>
        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '0.9rem', fontWeight: '500', color: '#374151' }}>
          Text Size:
          <input type="range" min="0.5" max="2.0" step="0.1" value={textSize} onChange={e => setTextSize(parseFloat(e.target.value))} style={{ width: '80px', cursor: 'pointer' }} />
          <span style={{ minWidth: '35px', fontSize: '0.8rem', color: '#6B7280' }}>{Math.round(textSize*100)}%</span>
        </label>
      </div>

      {/* SVG Color Wheel */}
      <svg
        className="color-wheel-svg"
        viewBox={isMobile() ? "160 140 380 400" : "120 100 460 480"}
        style={{ width: '100%', maxWidth: '700px', height: 'auto', display: 'block', margin: '0 auto' }}
      >
        {edges.map((edge, i) => {
          const pairCode = edge.u + edge.v;
          const isPrimary = currentSet.primaryArchetypes.includes(pairCode);
          const isHighlighted = activePair === pairCode;
          const isDimmed = activeColors.length > 0 && !activeColors.includes(edge.u) && !activeColors.includes(edge.v);
          return <EdgeLine key={`edge-${i}`} edge={edge} isHighlighted={isHighlighted} isDimmed={isDimmed}
                   isPrimary={isPrimary} isSimple={isSimple} config={config} />;
        })}
        {labelPositions.map((group, i) => {
          const pairCode = group.u + group.v;
          const isHighlighted = activePair === pairCode;
          const isDimmed = activeColors.length > 0 && !activeColors.includes(group.u) && !activeColors.includes(group.v);
          return <LabelBox key={`label-${i}`} group={group} isHighlighted={isHighlighted} isDimmed={isDimmed}
                   onHover={() => handlePairHover(pairCode)} onLeave={handlePairLeave} onClick={() => {}}
                   isSimple={isSimple} config={config} labels={currentSet.labels}
                   primaryArchetypes={currentSet.primaryArchetypes} />;
        })}
        {colorOrder.map((color, index) => {
          const isHighlighted = hoveredNode === color || activeColors.includes(color);
          const isDimmed = activeColors.length > 0 && !activeColors.includes(color);
          return <ColorNode key={`node-${color}`} color={color} index={index}
                   isHighlighted={isHighlighted} isDimmed={isDimmed}
                   onHover={() => setHoveredNode(color)} onLeave={() => setHoveredNode(null)}
                   isSimple={isSimple} config={config} />;
        })}
      </svg>

      {/* Color Grid */}
      <ColorGrid
        colorDescriptions={currentSet.colorDescriptions}
        scryfallCodes={currentSet.scryfallCodes}
        hoveredColor={hoveredColor}
        onColorHover={handleColorHover}
        onColorLeave={handleColorLeave}
        currentSet={currentSet}
      />

      {/* Archetypes Section */}
      <div id="archetypes" style={{ width: '100%', marginTop: '32px', marginBottom: '48px' }}>
        {allArch ? (
          <>
            <h2 style={{ fontSize: '1.3rem', fontWeight: '700', color: '#111827', marginBottom: '8px',
              paddingBottom: '8px', borderBottom: `2px solid ${currentSet.accentColor}` }}>
              ★ All 10 Archetypes
            </h2>
            <p style={{ fontSize: '0.85rem', color: '#6B7280', marginBottom: '16px' }}>
              {currentSet.name} supports all 10 color pairs with dedicated archetypes.
            </p>
            <div className="archetype-grid-10">
              {Object.entries(currentSet.labels).map(([pair, data]) => {
                const { bg, fg } = getLabelColors(pair[0], pair[1]);
                const sc = currentSet.scryfallCodes[0];
                return (
                  <div key={pair} style={{ backgroundColor: bg, color: fg, padding: '16px', borderRadius: '8px',
                    border: `2px solid ${blend(pair[0], pair[1])}` }}>
                    <div style={{ fontWeight: 'bold', fontSize: '1.1rem', marginBottom: '4px' }}>{pair}: {data.text}</div>
                    <div style={{ fontSize: '0.85rem', opacity: 0.9, marginBottom: '8px', fontStyle: 'italic' }}>{data.sub && data.sub.replace('\n', ' / ')}</div>
                    <div style={{ fontSize: '0.8rem', lineHeight: '1.4', opacity: 0.95, marginBottom: '8px' }}>{linkifyCards(data.details, data.cards, sc, fg)}</div>
                    {data.sourceText && (
                      <div style={{ fontSize: '0.7rem', opacity: 0.7, fontStyle: 'italic', marginBottom: '10px' }}>
                        <SourceLine data={data} fg={fg} />
                      </div>
                    )}
                    <ScryfallRow data={data} pair={pair} sc={sc} bg={bg} fg={fg} />
                  </div>
                );
              })}
            </div>
          </>
        ) : (
          <>
            {/* Primary archetypes */}
            <h2 style={{ fontSize: '1.3rem', fontWeight: '700', color: '#111827', marginBottom: '8px',
              paddingBottom: '8px', borderBottom: `2px solid ${currentSet.accentColor}` }}>
              ★ Primary Archetypes
            </h2>
            {currentSet.primaryDescription && (
              <p style={{ fontSize: '0.85rem', color: '#6B7280', marginBottom: '16px' }}>
                {currentSet.primaryDescription}
              </p>
            )}
            <div className="archetype-grid" style={{ display: 'grid',
              gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 150px), 1fr))', gap: '12px', alignSelf: 'stretch' }}>
              {primaryPairs.map(([pair, data]) => {
                const { bg, fg } = getLabelColors(pair[0], pair[1]);
                const sc = currentSet.scryfallCodes[0];
                return (
                  <div key={pair} style={{ backgroundColor: bg, color: fg, padding: '16px', borderRadius: '8px',
                    border: `2px solid ${blend(pair[0], pair[1])}` }}>
                    <div style={{ fontWeight: 'bold', fontSize: '1.1rem', marginBottom: '4px' }}>{pair}: {data.text}</div>
                    <div style={{ fontSize: '0.85rem', opacity: 0.9, marginBottom: '8px', fontStyle: 'italic' }}>{data.sub && data.sub.replace('\n', ' / ')}</div>
                    <div style={{ fontSize: '0.8rem', lineHeight: '1.4', opacity: 0.95, marginBottom: '8px' }}>{linkifyCards(data.details, data.cards, sc, fg)}</div>
                    {data.sourceText && (
                      <div style={{ fontSize: '0.7rem', opacity: 0.7, fontStyle: 'italic', marginBottom: '10px' }}>
                        <SourceLine data={data} fg={fg} />
                      </div>
                    )}
                    <ScryfallRow data={data} pair={pair} sc={sc} bg={bg} fg={fg} />
                    {data.mechanicDef && (
                      <div style={{ fontSize: '0.7rem', marginTop: '10px', padding: '6px 8px', borderRadius: '4px',
                        backgroundColor: 'rgba(255,255,255,0.15)', fontStyle: 'italic', lineHeight: '1.4', opacity: 0.9 }}>
                        {data.mechanicDef}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Secondary archetypes */}
            {secondaryPairs.length > 0 && (
              <div style={{ marginTop: '24px' }}>
                <h2 style={{ fontSize: '1.3rem', fontWeight: '700', color: '#111827', marginBottom: '8px',
                  paddingBottom: '8px', borderBottom: '2px solid #9CA3AF' }}>
                  Off-Arch / Secondary
                </h2>
                <p style={{ fontSize: '0.85rem', color: '#6B7280', marginBottom: '8px' }}>
                  These pairs have no dedicated archetype. You will very rarely be playing them, but the set has a decent amount of{' '}
                  <a href={`https://scryfall.com/search?q=%28otag%3Amana-producer+OR+type%3Aland+OR+otag%3Aramp%29+set%3A${currentSet.scryfallCodes[0]}&unique=cards&as=grid&order=edhrec&dir=`} target="_blank" rel="noopener noreferrer" style={{ color: '#4B5563', textDecoration: 'underline' }}>color fixing</a>
                  {' '}so 3 color is doable.
                </p>
                {secondaryHasWedges && (
                  <p style={{ fontSize: '0.85rem', color: '#6B7280', marginBottom: '16px' }}>
                    The most likely 3 color combinations for this set are the{' '}
                    <a href="https://mtg.fandom.com/wiki/Wedge" target="_blank" rel="noopener noreferrer" style={{ color: '#4B5563', textDecoration: 'underline' }}>'wedges'</a>
                    , with one 'central' color and its two 'enemy' colors (the ones opposite it on the color wheel). e.g. red, plus its enemies blue and white is Jeskai.
                  </p>
                )}
                <div className="archetype-grid" style={{ display: 'grid',
                  gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 150px), 1fr))', gap: '12px', alignSelf: 'stretch' }}>
                  {secondaryPairs.map(([pair, data]) => {
                    const { bg, fg } = getLabelColors(pair[0], pair[1]);
                    const sc = currentSet.scryfallCodes[0];
                    return (
                      <div key={pair} style={{ backgroundColor: bg, color: fg, padding: '16px', borderRadius: '8px',
                        border: `1px dashed ${blend(pair[0], pair[1])}`, opacity: 0.85 }}>
                        <div style={{ fontWeight: 'bold', fontSize: '1.1rem', marginBottom: '8px' }}>
                          {pair}: {data.text}{data.sub ? ` — ${data.sub.replace('\n', ' / ')}` : ''}
                        </div>
                        <div style={{ fontSize: '0.8rem', lineHeight: '1.4', opacity: 0.95, marginBottom: '8px' }}>{linkifyCards(data.details, data.cards, sc, fg)}</div>
                        {data.sourceText && (
                          <div style={{ fontSize: '0.7rem', opacity: 0.7, fontStyle: 'italic', marginBottom: '10px' }}>
                            <SourceLine data={data} fg={fg} />
                          </div>
                        )}
                        <ScryfallRow data={data} pair={pair} sc={sc} bg={bg} fg={fg} />
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </>
        )}

        {/* Set-wide mechanics (not tied to a college) */}
        {currentSet.setMechanics && currentSet.setMechanics.length > 0 && (
          <div style={{ marginTop: '24px' }}>
            <h2 style={{ fontSize: '1.3rem', fontWeight: '700', color: '#111827', marginBottom: '8px',
              paddingBottom: '8px', borderBottom: `2px solid ${currentSet.accentColor}` }}>
              Set-Wide Mechanics
            </h2>
            <p style={{ fontSize: '0.85rem', color: '#6B7280', marginBottom: '16px' }}>
              These mechanics appear across the set, not tied to a specific color pair.
            </p>
            <div className="archetype-grid" style={{ display: 'grid',
              gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 200px), 1fr))', gap: '12px', alignSelf: 'stretch' }}>
              {currentSet.setMechanics.map((mech, i) => {
                const sc = currentSet.scryfallCodes[0];
                const mechUrl = mech.scryfallQuery || `https://scryfall.com/search?q=set%3A${sc}+o%3A${mech.keyword}`;
                return (
                  <div key={i} style={{ backgroundColor: '#78350F', color: '#FEF3C7', padding: '16px', borderRadius: '8px',
                    border: `2px solid #F59E0B` }}>
                    <div style={{ fontWeight: 'bold', fontSize: '1.1rem', marginBottom: '8px' }}>{mech.name}</div>
                    <div style={{ fontSize: '0.8rem', lineHeight: '1.4', opacity: 0.95, marginBottom: '8px' }}>{linkifyCards(mech.description, mech.cards, sc, '#FDE68A')}</div>
                    {mech.source && (
                      <div style={{ fontSize: '0.7rem', opacity: 0.7, fontStyle: 'italic', marginBottom: '10px' }}>
                        Source: <a href={mech.sourceUrl} target="_blank" rel="noopener noreferrer" style={{ color: '#FDE68A', textDecoration: 'underline' }}>{mech.source}</a>
                      </div>
                    )}
                    <div style={{ fontSize: '0.65rem', opacity: 0.85, marginBottom: '5px', fontWeight: '600' }}>Scryfall:</div>
                    <a href={mechUrl} target="_blank" rel="noopener noreferrer"
                       style={{ display: 'inline-block', padding: '4px 10px', backgroundColor: '#FEF3C7', color: '#78350F',
                         textDecoration: 'none', borderRadius: '3px', fontSize: '0.65rem', fontWeight: '600' }}>
                      {mech.scryfallLabel || ('o:' + mech.keyword)}
                    </a>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* Sources & Citations (bottom) */}
      {currentSet.resourceLinks && currentSet.resourceLinks.length > 0 && (
        <div style={{
          marginTop: '8px', marginBottom: '24px', padding: '16px',
          backgroundColor: '#F9FAFB', borderRadius: '8px',
          border: '1px solid #E5E7EB', maxWidth: '900px',
          width: '100%',
        }}>
          <div style={{ fontSize: '0.8rem', color: '#6B7280', lineHeight: '1.6' }}>
            <strong style={{ color: '#374151' }}>Sources &amp; Citations:</strong><br />
            Archetype information sourced from official Wizards of the Coast materials and community resources:<br />
            {currentSet.resourceLinks.map((link, i) => (
              <span key={i}>
                {'• '}
                <a href={link.url} target="_blank" rel="noopener noreferrer"
                  style={{ color: '#2563EB', textDecoration: 'underline' }}>
                  {link.label}
                </a>
                {link.desc && <span> — {link.desc}</span>}
                <br />
              </span>
            ))}
            <br />
            <strong style={{ color: '#374151' }}>Interactive Features:</strong><br />
            • Hover over any color node (W/U/B/R/G) to see that color's role in the set<br />
            • Hover over archetype labels for detailed strategy and Scryfall links<br />
            • Click "A&amp;B" to see cards that are both colors (exactly those two)<br />
            • Click "A∪B" to see cards with at least one of those colors
          </div>
        </div>
      )}

      {/* Hover Info Panel */}
      <InfoPanel
        pair={activePair}
        labels={currentSet.labels}
        scryfallCodes={currentSet.scryfallCodes}
        primaryArchetypes={currentSet.primaryArchetypes}
        onHover={() => { if (pairTimeoutRef.current) { clearTimeout(pairTimeoutRef.current); pairTimeoutRef.current = null; } }}
        onLeave={handlePairLeave}
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MultiSetColorWheel />);
  </script>
</body>
</html>
